# =============================================================================
# Components - messages and schemas placeholder
# =============================================================================
# Due to file size, the full message and schema definitions continue below.
# Each message contains the complete inline payload schema.

components:

  securitySchemes:
    websocketAuth:
      type: httpApiKey
      in: query
      name: token
      description: Authenticated WebSocket session token obtained via REST API.

  messages:

    # =========================================================================
    # Market data messages
    # =========================================================================

    getBookRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **getBook**.
            type: string
            example: getBook
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the order book.
            type: string
            example: BTC-EUR
          depth:
            description: The number of `bids` and `asks` to return.
            type: integer
            minimum: 1
            maximum: 1000
            example: 5

    getBookResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getBook
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              market:
                description: The market for which the order book is returned.
                type: string
                example: BTC-EUR
              nonce:
                description: |
                  Unique identifier of the market data in the order book at a specific time. `nonce` is incremented by 1 every time the order book changes.
                  For example, when an order is placed, updated, or deleted.
                type: integer
                example: 438524
              bids:
                type: array
                description: |
                  The list of buy orders for the specified `market` and `depth`. Every bid contains:

                  - `price`: the offer for 1 unit of base currency in the amount of quote currency. For 
                  example, **34243** Euros.

                  - `size`: the amount of base currency in the offer. For example, **0.1** Bitcoin.
                items:
                  type: array
                  items:
                    type: string
                example:
                  - - '4999.9'
                    - '0.015'
                  - - '4999.8'
                    - '0.015'
              asks:
                type: array
                description: |
                  The list of sell orders for the specified `market` and `depth`. Every bid contains:

                    - `price`: the offer for 1 unit of base currency in the amount of quote currency. For 
                  example, **34243** Euros.                   

                    - `size`: the amount of base currency in the offer. For example, **0.1** Bitcoin.
                items:
                  type: array
                  items:
                    type: string
                example:
                  - - '5001.1'
                    - '0.015'
                  - - '5001.2'
                    - '0.015'
              timestamp:
                description: The Unix timestamp in nanoseconds of the last transaction event.
                type: integer
                example: 1752139200000000000

    getTradesRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **getTrades**.
            type: string
            example: getTrades
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the trades.
            type: string
            example: BTC-EUR
          limit:
            description: The maximum number of trades to return.
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
          start:
            description: |
              The Unix timestamp in milliseconds starting from which to return trades.
              <br/>
              > Can only return trades for a period of up to 24 hours.
            type: integer
            example: 1751541801000
          end:
            description: |
              The Unix timestamp in milliseconds until which to return trades.
              <br/>
              > Cannot be more than 24 hours after the `start` timestamp. Can only return trades for a period of up to 24 hours.
            type: integer
            example: 1751548920000
          tradeIdFrom:
            description: The unique identifier of the trade starting from which to return the trades.
            type: string
          tradeIdTo:
            description: The unique identifier of the trade up to which to return the trades.
            type: string

    getTradesResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getTrades
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              id:
                description: The unique identifier of the trade.
                type: string
                example: 57b1159b-6bf5-4cde-9e2c-6bd6a5678baf
              timestamp:
                description: The Unix timestamp in milliseconds when the trade was made.
                type: integer
                example: 1542967486256
              amount:
                description: The amount of base currency exchanged in the trade. For example, **0.1** Bitcoin.
                type: string
                example: '0.1'
              price:
                description: |
                  The price of 1 unit of base currency in the amount of quote currency at the time of the trade.
                  For example, **34243** Euro.
                type: string
                example: '34243'
              side:
                description: Indicates if the taker, who fills the order, is selling or buying.
                type: string
                enum:
                  - sell
                  - buy

    getTickerPriceRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **getTickerPrice**.
            type: string
            example: getTickerPrice
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the order book.
            type: string
            example: BTC-EUR

    getTickerPriceResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getTickerPrice
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              market:
                description: The market for which you requested the latest trade price.
                type: string
                example: BTC-EUR
              price:
                description: |
                  The latest trade price for 1 unit of base currency in the amount of quote currency for the specified `market`. For example, **34243** Euro.
                type: string
                example: '34243'

    getTickerBookRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **getTickerBook**.
            type: string
            example: getTickerBook
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the order book.
            type: string
            example: BTC-EUR

    getTickerBookResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getTickerBook
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              market:
                description: The market for which you requested the latest trade price.
                type: string
                example: BTC-EUR
              bid:
                description: The highest buy order in the quote currency for the `market` currently available on Bitvavo.
                type: string
                example: '4999.9'
              bidSize:
                description: The amount of base currency for the `bid` in the order.
                type: string
                example: '0.15'
              ask:
                description: The lowest sell order in the quote currency for the `market` currently available on Bitvavo.
                type: string
                example: '5003.3'
              askSize:
                description: The amount of base currency for the `ask` in the order.
                type: string
                example: '0.2'

    getCandlesRequest:
      payload:
        type: object
        required:
          - market
          - interval
        properties:
          action:
            description: Set value to **getCandles**.
            type: string
            example: getCandles
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the order book.
            type: string
            example: BTC-EUR
          interval:
            description: The time interval between each candlestick. Determines the allowed values for `start` and `end` parameters.
            type: string
            enum:
              - 1m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 6h
              - 8h
              - 12h
              - 1d
              - 1W
              - 1M
          limit:
            description: The maximum number of candlestick data to return.
            type: integer
            minimum: 1
            maximum: 1440
            default: 1440
          start:
            description: |
              The Unix timestamp in milliseconds starting from which to return the candlestick data.
              <br/>
              > The timestamp must align exactly with the start of the specified `interval`. For example, for a 1-hour candlestick that starts at 13:00:00.000 Amsterdam time, use `1704067200000`.
            type: integer
            example: 1704067200000
          end:
            description: |
              The Unix timestamp in milliseconds until which to return the candlestick data.
              <br/>
              > The timestamp must align exactly with the end of the specified `interval`. For example, for a 1-hour candlestick that ends at 14:00:00.000 Amsterdam time, use `1766062800000`.
            type: integer
            example: 1704153600000

    getCandlesResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getCandles
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: array
            description: |
              An array with the candlestick data for the specified time period. Each element is an array containing exactly 6 values in this order:

              - `timestamp` (integer): Unix timestamp in milliseconds for the start of the candlestick period.
              - `open` (string): The starting price for the `market` at `timestamp`.
              - `high` (string): The highest price for the `market` during the `interval`.
              - `low` (string): The lowest price for the `market` during the `interval`.
              - `close` (string): The closing price for the `market` after the `interval`.
              - `volume` (string): The amount traded in the `market` during the `interval`.
            items:
              type: array
              minItems: 6
              maxItems: 6
            example:
              - [1704153540000, "40050", "40071", "40049", "40071", "0.52680563"]
              - [1704153480000, "40021", "40054", "40021", "40053", "2.64389051"]

    getTicker24hRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **getTicker24h**.
            type: string
            example: getTicker24h
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the order book.
            type: string
            example: BTC-EUR

    getTicker24hResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: getTicker24h
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              market:
                description: The market for which you requested the ticker data.
                type: string
                example: BTC-EUR
              startTimestamp:
                description: The Unix timestamp in milliseconds starting from which to return the data.
                type: integer
                example: 1700490607372
              timestamp:
                description: The Unix timestamp in milliseconds when the data was requested.
                type: integer
                example: 1700576057382
              open:
                description: The opening price for the `market` in the base currency.
                type: string
                example: '5001.1'
              openTimestamp:
                description: The Unix timestamp in milliseconds when the `market` opened after the `startTimestamp`.
                type: integer
                example: 1700490620146
              high:
                description: The highest trade price for 1 unit of base currency in the quote currency.
                type: string
                example: '5003.2'
              low:
                description: The lowest trade price for 1 unit of base currency in the quote currency.
                type: string
                example: '5001.1'
              last:
                description: The latest trade price for 1 unit of base currency in the quote currency.
                type: string
                example: '5003.2'
              closeTimestamp:
                description: The Unix timestamp in milliseconds when the `market` closed after the `startTimestamp`.
                type: integer
                example: 1700490620146
              bid:
                description: The highest buy order in the quote currency.
                type: string
                example: '4999.9'
              bidSize:
                description: The amount of base currency for the `bid`.
                type: string
                example: '0.15'
              ask:
                description: The lowest sell order in the quote currency.
                type: string
                example: '5003.3'
              askSize:
                description: The amount of base currency for the `ask`.
                type: string
                example: '0.2'
              volume:
                description: The total amount of base currency traded.
                type: string
                example: '0.15'
              volumeQuote:
                description: The total amount of quote currency traded.
                type: string
                example: '750.2865'

    # =========================================================================
    # Trading messages
    # =========================================================================

    privateCreateOrderRequest:
      payload:
        type: object
        required:
          - market
          - side
          - orderType
          - operatorId
        properties:
          action:
            description: Set value to **privateCreateOrder**.
            type: string
            example: privateCreateOrder
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            type: string
            example: BTC-EUR
            description: The market in which to create the order.
          side:
            type: string
            enum: [buy, sell]
            description: Indicates whether the order is to buy or sell the asset.
          orderType:
            type: string
            enum: [market, limit, stopLoss, stopLossLimit, takeProfit, takeProfitLimit]
            description: |
              The type of order to create. Possible values:

              - `market`: an order to buy or sell digital assets at the current market `price`. 
              - `limit`: an order to buy or sell digital assets at the specified `price` or better.
              - `stopLoss`: a market order to buy or sell digital assets when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.
              - `stopLossLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.
              - `takeProfit`: a market order to buy or sell digital assets when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.
              - `takeProfitLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.

              <br/>

              > For limit orders, you need to set `amount` and `price`. For market orders, you need to set either `amount` or `amountQuote`.
          operatorId:
            description: Your identifier for the trader or the bot within your account that made the request.
            type: integer
            format: int64
            example: 543462
          clientOrderId:
            type: string
            format: UUID
            description: Your identifier of the order. Must be unique across open orders.
            example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
          amount:
            type: string
            example: '1.567'
            description: |
              The quantity of the base currency to buy or sell. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.
          amountQuote:
            type: string
            example: '5000'
            description: |
              The quantity of the quote currency to buy or sell for the `market`, `stopLoss`, or `takeProfit` order types. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.
          price:
            type: string
            example: '6000'
            description: |
              The price in quote currency for which you want to buy or sell 1 unit of the base currency.

              <br/>

              > Must be a multiple of the `tickSize` value for the market. To get the `tickSize`, make a [Get markets](/docs/websocket-api/get-markets/) request.
          triggerAmount:
            type: string
            example: '4000'
            description: The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.
          triggerType:
            type: string
            enum: [price]
            description: The type of trigger that fills the order when the condition is met.
          triggerReference:
            type: string
            enum: [lastTrade, bestBid, bestAsk, midPrice]
            description: The price which triggers the order to be filled for `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` types of orders.
          timeInForce:
            type: string
            enum: [GTC, IOC, FOK]
            default: GTC
            description: How long an order stays active for.
          postOnly:
            type: boolean
            default: false
            description: If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.
          selfTradePrevention:
            type: string
            enum: [cancelBoth, cancelNewest, cancelOldest, decrementAndCancel]
            default: decrementAndCancel
            description: |
              **[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.

              Indicates how to prevent self-trading for conflicting orders of any type.

              Possible values:
              - `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. 
              For example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.
              - `cancelOldest`: cancels the older conflicting order in the same market.
              - `cancelNewest`: cancels the later conflicting order in the same market.
              - `cancelBoth`: cancels both conflicting orders in the same market.
          disableMarketProtection:
            type: boolean
            default: false
            deprecated: true
            description: Must be **false** because market protection can no longer be disabled.
          responseRequired:
            type: boolean
            default: true
            description: |
              Indicates whether the response returns all parameters (**true**) or only the HTTP status code (**false**).
          codGroupId:
            type: integer
            example: 1
            minimum: 1
            maximum: 1000
            description: Your identifier for a [group of orders](/docs/websocket-api/cancel-orders-after/).

    privateUpdateOrderRequest:
      payload:
        type: object
        required:
          - market
          - operatorId
        properties:
          action:
            description: Set value to **privateUpdateOrder**.
            type: string
            example: privateUpdateOrder
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market in which to update an order.
            type: string
            example: BTC-EUR
          operatorId:
            description: Your identifier for the trader or the bot within your account that made the request.
            type: integer
            format: int64
            example: 543462
          orderId:
            description: Bitvavo identifier of the order to update.
            type: string
            format: UUID
            example: 95d92d6c-ecf0-4960-a608-9953ef71652e
          clientOrderId:
            description: |
              Your identifier of the order to update. Must be unique among open orders.

              <br/>

              > If both `clientOrderId` and `orderId` are set, we use the `clientOrderId` to identify the order.
            type: string
            format: UUID
            example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
          amount:
            description: |
              The amount of base currency to update. Specifying the `amount` automatically adjusts the `amountRemaining`. 

              <br/>

              To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.
            type: string
            example: '1.567'
          amountQuote:
            description: |
              **Only for `takeProfit` and `stopLoss` orders that are not triggered yet**. The amount of quote currency to buy or sell at the best available price. 

              <br/>

              > To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `notionalDecimals` field.
            type: string
            example: '5000'
          amountRemaining:
            description: |
              The remaining amount of base currency to update. Specifying the `amountRemaining` automatically adjusts the `amount`.

              <br/>

              > We discourage updating the `amountRemaining` because you can end up buying or selling more than you intended.
            type: string
            example: '1.560'
          price:
            description: |
              The amount of quote currency for 1 unit of the base currency.

              <br/>

              > Must be a multiple of the `tickSize` value for the market. To get the `tickSize`, make a [Get markets](/docs/websocket-api/get-markets/) request.
            type: string
            example: '6000'
          triggerAmount:
            description: |
              **Only for stop orders**. The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.

              <br/>

              > You can only update orders that have not been triggered yet.
            type: string
            example: '4000'
          timeInForce:
            description: |
              How long an `orderType` stays active for. Possible values:

              - `FOK`: *Fill-Or-Kill*. Fills the entire order from existing orders, or cancels the entire order.
              - `GTC`: *Good-Til-Canceled*. Stays in the order book until the entire order is filled or you manually cancel it. 
              - `IOC`: *Immediate-Or-Cancel*. Fills existing orders and cancels the unfilled balance.

              <br/>

              > You can only update orders that have not been triggered yet.
            type: string
            enum: [GTC, IOC, FOK]
          selfTradePrevention:
            description: |
              **[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.

              Indicates how to prevent self-trading for conflicting orders of any type.

              Possible values:
              - `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. 
              For example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.
              - `cancelOldest`: cancels the older conflicting order in the same market.
              - `cancelNewest`: cancels the later conflicting order in the same market.
              - `cancelBoth`: cancels both conflicting orders in the same market.
            type: string
            enum: [decrementAndCancel, cancelOldest, cancelNewest, cancelBoth]
          postOnly:
            description: |
              If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.
            type: boolean
          responseRequired:
            description: |
              Indicates whether the response returns all parameters (**true**) or only the HTTP status code (**false**).
            type: boolean
            default: true

    privateGetOrderRequest:
      payload:
        type: object
        required:
          - market
          - orderId
        properties:
          action:
            description: Set value to **privateGetOrder**.
            type: string
            example: privateGetOrder
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market in which to update an order.
            type: string
            example: BTC-EUR
          orderId:
            description: Bitvavo identifier of the order to update.
            type: string
            format: UUID
            example: 95d92d6c-ecf0-4960-a608-9953ef71652e
          clientOrderId:
            description: |
              Your identifier of the order to update. Must be unique among open orders.

              <br/>

              > If both `clientOrderId` and `orderId` are set, we use the `clientOrderId` to identify the order.
            type: string
            format: UUID
            example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9

    privateCancelOrderRequest:
      payload:
        type: object
        required:
          - market
          - operatorId
        properties:
          action:
            description: Set value to **privateCancelOrder**.
            type: string
            example: privateCancelOrder
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market in which to update an order.
            type: string
            example: BTC-EUR
          operatorId:
            description: Your identifier for the trader or the bot within your account that made the request.
            type: integer
            format: int64
            example: 543462
          orderId:
            description: Bitvavo identifier of the order to update.
            type: string
            format: UUID
            example: 95d92d6c-ecf0-4960-a608-9953ef71652e
          clientOrderId:
            description: |
              Your identifier of the order to cancel.

              <br/>

              > If both `clientOrderId` and `orderId` are set, we use the `clientOrderId` to identify the order.
            type: string
            format: UUID
            example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9

    privateCancelOrderResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateCancelOrder
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              orderId:
                description: Bitvavo identifier of the order.
                type: string
                format: UUID
                example: 2e7ce7fc-44e2-4d80-a4a7-d079c4750b61
              clientOrderId:
                description: Your identifier of the cancelled order. Only returned if specified in the request.
                type: string
                format: UUID
                example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
              operatorId:
                description: Your identifier for the trader or the bot within your account that made the request.
                type: integer
                format: int64
                example: 543462

    privateGetOrdersOpenRequest:
      payload:
        type: object
        properties:
          action:
            description: Set value to **privateGetOrdersOpen**.
            type: string
            example: privateGetOrdersOpen
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market in which return the open orders.
            type: string
            example: BTC-EUR
          base:
            description: The base asset for which to return the open orders. If neither `market` nor `base` are specified, all open orders are returned.
            type: string
            example: BTC

    privateGetTradesRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **privateGetTrades**.
            type: string
            example: privateGetTrades
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the trades.
            type: string
            example: BTC-EUR
          limit:
            description: The maximum number of trades to return.
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
          start:
            description: |
              The Unix timestamp in milliseconds starting from which to return trades.
              <br/>
              > Can only return trades for a period of up to 24 hours.
            type: integer
            example: 1751541801000
          end:
            description: |
              The Unix timestamp in milliseconds until which to return trades.
              <br/>
              > Cannot be more than 24 hours after the `start` timestamp. Can only return trades for a period of up to 24 hours.
            type: integer
            example: 1751548920000
          tradeIdFrom:
            description: The unique identifier of the trade starting from which to return the trades.
            type: string
          tradeIdTo:
            description: The unique identifier of the trade up to which to return the trades.
            type: string

    privateGetTradesResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateGetTrades
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              id:
                description: The unique identifier of the fill.
                type: string
                example: 108c3633-0276-4480-a902-17a01829deae
              orderId:
                description: Bitvavo identifier of the order that was filled.
                type: string
                format: UUID
                example: 1d671998-3d44-4df4-965f-0d48bd129a1b
              clientOrderId:
                description: Your identifier of the order that was filled.
                type: string
                format: UUID
                example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
              timestamp:
                description: The Unix timestamp in milliseconds when the trade was made.
                type: integer
                example: 1542967486256
              market:
                description: The market for which to return past trades.
                type: string
                example: BTC-EUR
              side:
                description: Indicates if the taker, who filled the order, is selling or buying.
                type: string
                enum: [buy, sell]
              amount:
                description: The amount of base currency exchanged in the trade.
                type: string
                example: '0.005'
              price:
                description: The price of 1 unit of base currency in the amount of quote currency at the time of the trade.
                type: string
                example: '5000.1'
              taker:
                description: Indicates whether you are the taker for the fill.
                type: boolean
                example: true
              fee:
                description: The fee that was paid. Value is negative for rebates. Only available if `settled` is true.
                type: string
                example: '0.03'
              feeCurrency:
                description: Currency in which the fee was paid. Only available is `settled` is true.
                type: string
                example: EUR
              settled:
                description: |
                  Indicates whether the fee was deducted and the exchanged
                  currency is available for further trading.
                type: boolean

    privateGetOrdersRequest:
      payload:
        type: object
        required:
          - market
        properties:
          action:
            description: Set value to **privateGetOrders**.
            type: string
            example: privateGetOrders
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          market:
            description: The market for which to return the orders.
            type: string
            example: BTC-EUR
          limit:
            description: The maximum number of orders to return.
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
          start:
            description: The Unix timestamp in milliseconds starting from which to return orders.
            type: integer
            example: 1751541801000
