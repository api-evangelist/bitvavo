            description: The returned event.
            type: string
            example: fill
          market:
            description: The market in which the order was placed.
            type: string
            example: BTC-EUR
          orderId:
            description: The identifier of the order on which has been filled.
            type: string
            format: UUID
            example: 80b5f04d-21fc-4ebe-9c5f-6d34f78ee477
          clientOrderId:
            description: Your identifier of the order. Only returned if specified in the request.
            type: string
            format: UUID
            example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
          operatorId:
            description: The identifier for the trader or the bot that made the request.
            type: integer
            format: int64
            example: 543462
          fillId:
            description: The identifier of the returned fill.
            type: string
            example: 15d14b09-389d-4f83-9413-de9d0d8e7715
          timestamp:
            description: The current Unix timestamp in milliseconds.
            type: integer
            example: 1542967486256
          amount:
            description: The amount in base currency for which the trade has been made.
            type: string
            example: '0.005'
          side:
            description: Indicates if the order was to buy or sell an asset.
            type: string
            enum: [sell, buy]
          price:
            description: The price in quote currency for which the trade has been made.
            type: string
            example: '5000.1'
          taker:
            description: |
              Indicates if you are the taker or maker in the trade.

              - `true`: you are the taker. Your order filled a resting order.
              - `false`: you are the maker. Your resting order was filled by an incoming order.
            type: boolean
            example: true
          fee:
            description: |
              The amount you pay Bitvavo in `feeCurrency` to process `orderId`. For more information about your fees, call
              GET [/account/fees](/docs/rest-api/get-market-fees).


              If settled is `false`, this object is not included in these return parameters.
              To retrieve the value of `settled`, see the `fills` object in the return parameters for calls to
              GET [`/order`](/docs/rest-api/get-order).


              `fee` is negative for rebates.
            type: string
            example: '0.03'
          feeCurrency:
            description: |
              The currency that `fee` is paid in.


              If settled is `false`, this object is not included in these return parameters.
              To retrieve the value of `settled`, see the `fills` object in the return parameters for calls to 
              GET [`/order`](/docs/rest-api/get-order).
            type: string
            example: EUR
          timestampNs:
            description: The current Unix timestamp in nanoseconds.
            type: integer
            example: 1752139200000000000

  # ===========================================================================
  # Reusable schemas
  # ===========================================================================

  schemas:

    OrderResponseFull:
      type: object
      properties:
        action:
          description: The action performed.
          type: string
        requestId:
          description: Your identifier for the request.
          type: integer
          example: 1
        response:
          type: object
          properties:
            orderId:
              type: string
              format: UUID
              description: |
                Bitvavo identifier of the order. An `orderId` is unique per `market`. Different markets can use the same `orderId` values.
              example: 1be6d0df-d5dc-4b53-a250-3376f3b393e6
            clientOrderId:
              description: Your identifier of the order. Only returned if specified in the request.
              type: string
              format: UUID
              example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
            market:
              type: string
              example: BTC-EUR
              description: The market where you created an order.
            created:
              description: The Unix timestamp in milliseconds when the order was created.
              type: integer
              example: 1706100650751
            updated:
              description: The Unix timestamp in milliseconds when the order was last updated.
              type: integer
              example: 1706100650751
            status:
              description: |
                The status of an order. Possible values:
                - `new`: the `orderId` has been added to the order book and has not been filled.
                - `awaitingTrigger`: the conditions to fill an order haven't been met. 
                - `canceled`: the `orderId` has been removed from the order book. 
                - `expired`: the market order expires because there is no match, enough liquidity in the order book, or enough balance in your account.
                - `filled`: all trades necessary to complete the order have been filled. 
                - `partiallyFilled`: the order is still active. Bitvavo needs to receive more matching orders to completely fill the order.
              type: string
              enum: [new, awaitingTrigger, canceled, expired, filled, partiallyFilled]
            side:
              description: Indicates whether the order is to buy or sell the asset.
              type: string
              enum: [buy, sell]
            orderType:
              description: The type of order you created.
              type: string
              enum: [limit, market]
            amount:
              description: |
                The quantity of the base currency to buy or sell.
                If you set `amountQuote` in your order, `amount` is not returned.
              type: string
              example: '10'
            amountRemaining:
              description: |
                The quantity of the base currency remaining after the sum of fills is subtracted from the `amount`.
                If you set `amountQuote` in your order, `amountRemaining` is not returned.
              type: string
              example: '10'
            price:
              description: |
                The price you set for a `limit`, `stopLossLimit`, `takeProfit`, or a `takeProfitLimit` order.
                For other types of orders, the `price` is not returned.
              type: string
              example: '7000'
            amountQuote:
              description: |
                The quantity of the quote currency to buy or sell for the market, `stopLoss`, or `takeProfit` types of order. 
                If you set `amount` in your order, `amountQuote` is not returned.
              type: string
              example: '5000'
            amountQuoteRemaining:
              description: |
                The quantity of the quote currency remaining after the sum of all fills is 
                subtracted from `amountQuote`.

                If you set `amount` in the order, `amountQuoteRemaining` is not returned.
              type: string
              example: '5000'
            onHold:
              description: |
                The amount of `onHoldCurrency` locked while an order is not yet `settled` after an order is filled.
                All funds are released when order is filled.
              type: string
              example: '70000'
            onHoldCurrency:
              description: |
                The currency that is `onHold` while the order is processed. This depends on the `side` you set for the `orderId`.
              type: string
              example: EUR
            triggerPrice:
              description: |
                The price calculated using `triggerAmount` and 
                `triggerType` for the `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` 
                types of orders.   

                For example, when you set `triggerAmount` to 4000 and `triggerType` to `price`, your order is placed in a `market` 
                when the `triggerReference` price in quote currency reaches 4000.
              type: string
              example: '4000'
            triggerAmount:
              description: |
                The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.  
                This value and `triggerType` are used to calculate `triggerPrice`.
              type: string
              example: '4000'
            triggerType:
              description: |
                The type of trigger you set to fill the order when the condition is met. This value and `triggerAmount` are used to calculate `triggerPrice`.
              type: string
              enum: [price]
            triggerReference:
              description: |
                The price you set to trigger the order to be filled for the `stopLoss`, `stopLossLimit`, `takeProfit`, or  `takeProfitLimit` types of orders.
              type: string
              enum: [lastTrade, bestBid, bestAsk, midPrice]
            filledAmount:
              description: The total amount bought or sold in base currency.
              type: string
              example: '0'
            filledAmountQuote:
              description: The total amount bought or sold in quote currency.
              type: string
              example: '0'
            feePaid:
              description: |
                The amount you pay Bitvavo to process the order. This value is negative for rebates. For more information, see
                GET [/account/fees](/docs/rest-api/get-market-fees).
              type: string
              example: '0'
            feeCurrency:
              description: The currency of the `feePaid`.
              type: string
              example: EUR
            fills:
              description: A JSON object containing all fills for `orderId`.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: The identifier of this fill.
                    type: string
                    example: 371c6bd3-d06d-4573-9f15-18697cd210e5
                  timestamp:
                    description: The Unix timestamp in milliseconds when Bitvavo processed the fill.
                    type: integer
                    example: 1542967486256
                  amount:
                    description: The amount of base currency exchanged in the fill.
                    type: string
                    example: '0.005'
                  price:
                    description: The price of the fill in quote currency.
                    type: string
                    example: '5000.1'
                  taker:
                    description: Returns `true` when you are the taker for the fill.
                    type: boolean
                    example: true
                  fee:
                    description: |
                      The amount you pay Bitvavo in `feeCurrency` to process the fill. For more information about your fees, see 
                      GET [/account/fees](/docs/rest-api/get-market-fees). This value is negative for rebates.

                      If `settled` is `false`, this parameter is not included in the return parameters.
                    type: string
                    example: '0.03'
                  feeCurrency:
                    description: |
                      The currency that the `fee` is paid in.

                      If `settled` is `false`, this object is not returned.
                    type: string
                    example: EUR
                  settled:
                    description: |
                      On Bitvavo, trade settlement happens after an order is filled. When the fill is complete and the `fee` is not yet 
                      paid, `settled` is `false`.
                    type: boolean
            selfTradePrevention:
              description: |
                **[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.

                Indicates how to prevent self-trading for conflicting orders of any type.

                Possible values:
                  - `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order.
                For example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.
                - `cancelOldest`: cancels the older conflicting order in the same market.
                - `cancelNewest`: cancels the later conflicting order in the same market.
                - `cancelBoth`: cancels both conflicting orders in the same market.
              type: string
              enum: [decrementAndCancel, cancelOldest, cancelNewest, cancelBoth]
            visible:
              description: |
                Returns `true` when the `orderId` is visible in the [order book](/docs/websocket-api/get-order-book) for a `market`.
              type: boolean
            timeInForce:
              description: The value you set for how long an order stays active.
              type: string
              enum: [GTC, IOC, FOK]
            postOnly:
              description: |
                If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.
              type: boolean
            disableMarketProtection:
              description: Must be **false** because market protection can no longer be disabled.
              type: boolean
              deprecated: true
            operatorId:
              description: Your identifier for the trader or the bot within your account.
              type: integer
              format: int64
              example: 543462
            restatementReason:
              description: |
                Specifies the reason why the status of the order was changed. For example, when an order is canceled by the [Price protection checks](/docs/order-lifecycle/#price-protection).
              type: string
              enum: [decrementOnSelfTradePrevention, cancelOnSelfTradePrevention, cancelOnPlacementPriceProtection, cancelOnExecutionPriceProtection, cancelOnSpreadProtection, cancelOnReferencePriceProtection, cancelPostOnlyOnAuctionMatching, cancelOnMaintenance, cancelOnDisconnect, cancelOnDelisting, cancelOnLockPlaced, cancelOnAdminRequest, cancelPostOnly]
            createdNs:
              description: The Unix timestamp in nanoseconds when the order was created.
              type: integer
              example: 1752139200000000000
            updatedNs:
              description: The Unix timestamp in nanoseconds when the order was last updated.
              type: integer
              example: 1752139200000000000
            codGroupId:
              type: integer
              example: 1
              description: Your identifier for a [group of orders](/docs/websocket-api/cancel-orders-after/).

    OrderResponseMinimal:
      type: object
      properties:
        action:
          description: The action performed.
          type: string
        requestId:
          description: Your identifier for the request.
          type: integer
          example: 1
        response:
          type: object
          properties:
            market:
              type: string
              example: BTC-EUR
              description: The market where you created an order.
            orderId:
              type: string
              format: UUID
              description: The identifier of the order.
              example: 1be6d0df-d5dc-4b53-a250-3376f3b393e6
            clientOrderId:
              description: Your identifier of the order. Only returned if specified in the request.
              type: string
              format: UUID
              example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
            created:
              description: The Unix timestamp in milliseconds when the order was created.
              type: integer
              example: 1706100650751
            updated:
              description: The Unix timestamp in milliseconds when the order was last updated.
              type: integer
              example: 1706100650751
            createdNs:
              description: The Unix timestamp in nanoseconds when the order was created.
              type: integer
              example: 1752139200000000000
            updatedNs:
              description: The Unix timestamp in nanoseconds when the order was last updated.
              type: integer
              example: 1752139200000000000

    AccountOrderEvent:
      type: object
      required:
        - operatorId
      properties:
        event:
          description: The returned event.
          type: string
          example: order
        orderId:
          description: |
            Bitvavo identifier of the order. An `orderId` is unique per `market`. Different markets can use the same `orderId` values.
          type: string
          format: UUID
          example: 80b5f04d-21fc-4ebe-9c5f-6d34f78ee477
        clientOrderId:
          description: Your identifier of the order. Only returned if specified in the request.
          type: string
          format: UUID
          example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
        operatorId:
          description: Teh identifier for the trader or the bot that made the request.
          type: integer
          format: int64
          example: 543462
        market:
          description: The market in which the order was placed.
          type: string
          example: BTC-EUR
        created:
          description: The Unix timestamp in milliseconds when the order was created.
          type: integer
          example: 1548684420771
        updated:
          description: The Unix timestamp in milliseconds when the order was last updated.
          type: integer
          example: 1548684420771
        status:
          description: The current status of the order.
          type: string
          enum: [new, awaitingTrigger, canceled, expired, filled, partiallyFilled]
        side:
          description: Indicates whether the order is to buy or sell the asset.
          type: string
          enum: [buy, sell]
        orderType:
          description: The type of order you created.
          type: string
          enum: [limit, market]
        amount:
          description: The quantity of the base currency to buy or sell.
          type: string
          example: '1'
        amountRemaining:
          description: |
            The quantity of the base currency remaining after the sum of fills is subtracted from the `amount`.
          type: string
          example: '0.567'
        price:
          description: The price of the order.
          type: string
          example: '9225.1'
        onHold:
          description: |
            The amount of 'onHoldCurrency' that is reserved for this order. This is released when orders are canceled.
          type: string
          example: '9225.1'
        onHoldCurrency:
          description: |
            The currency that is `onHold` while the order is processed. This is the quote currency for buy orders and base currency for sell orders.
          type: string
          example: EUR
        triggerPrice:
          description: |
            The price calculated using `triggerAmount` and `triggerType` for the `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` types of orders.
          type: string
          example: '4000'
        triggerAmount:
          description: |
            The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.
            This value and `triggerType` are used to calculate `triggerPrice`.
          type: string
          example: '4000'
        triggerType:
          description: |
            The type of trigger you set to fill the order when the condition is met. This value and `triggerAmount` are used to calculate `triggerPrice`.
          type: string
          enum: [price]
        triggerReference:
          description: |
            The reference price which triggered the order to be filled for `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` types of orders.
          type: string
          enum: [lastTrade, bestBid, bestAsk, midPrice]
        timeInForce:
          description: |
            **Only for limit orders**. How long an `orderType` stays active for.

            Possible values:

            - `FOK`: *Fill-Or-Kill*. Fills the entire order from existing orders, or cancels the entire order.
            - `GTC`: *Good-Til-Canceled*. Stays in the order book until the entire order is filled or you manually cancel it.
            - `IOC`: *Immediate-Or-Cancel*. Fills existing orders and cancels the unfilled balance.
          type: string
          enum: [GTC, IOC, FOK]
        postOnly:
          description: |
            If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.
          type: boolean
          default: false
        selfTradePrevention:
          description: |
              **[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.

              Indicates how to prevent self-trading for conflicting orders of any type.

              Possible values:
              - `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. 
              For example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.
              - `cancelOldest`: cancels the older conflicting order in the same market.
              - `cancelNewest`: cancels the later conflicting order in the same market.
              - `cancelBoth`: cancels both conflicting orders in the same market.
          type: string
          enum: [decrementAndCancel, cancelOldest, cancelNewest, cancelBoth]
          default: decrementAndCancel
        visible:
          description: Whether this order is visible in the order book.
          type: boolean
        filledAmount:
          type: string
          example: '1.234'
          description: The total amount of the base currency that has been filled.
        filledAmountQuote:
          type: string
          example: '5000'
          description: The total amount of the quote currency that has been filled.
        executionType:
          description: The type of update executed for the order.
          type: string
          enum: [new, trade, canceled, expired, updated, triggered, restated]
        restatementReason:
          description: |
            Specifies the reason why the status of the order was changed. For example, when an order is canceled by the [Price protection checks](/docs/order-lifecycle/#price-protection).
          type: string
          enum: [decrementOnSelfTradePrevention, cancelOnSelfTradePrevention, cancelOnPlacementPriceProtection, cancelOnExecutionPriceProtection, cancelOnSpreadProtection, cancelOnReferencePriceProtection, cancelPostOnlyOnAuctionMatching, cancelOnMaintenance, cancelOnDisconnect, cancelOnDelisting, cancelOnLockPlaced, cancelOnAdminRequest, cancelPostOnly]
        createdNs:
          description: The Unix timestamp in nanoseconds when the order was created.
          type: integer
          example: 1752139200000000000
        updatedNs:
          description: The Unix timestamp in nanoseconds when the order was last updated.
          type: integer
          example: 1752139200000000000
        codGroupId:
          type: integer
          example: 1
          description: Your identifier for a [group of orders](/docs/websocket-api/cancel-orders-after/).
