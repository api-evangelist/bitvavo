    privateGetTransactionHistoryRequest:
      payload:
        type: object
        properties:
          action:
            description: Set value to **privateGetTransactionHistory**.
            type: string
            example: privateGetTransactionHistory
          requestId:
            description: Your identifier for the request.
            type: string
            example: 1
          fromDate:
            description: The Unix timestamp in milliseconds starting from which to return transactions.
            type: integer
            example: 1751328000000
          toDate:
            description: The Unix timestamp in milliseconds up to which to return transactions.
            type: integer
            example: 1754006399000
          page:
            description: The page number for the transaction history.
            type: integer
            minimum: 1
            example: 1
          maxItems:
            description: The maximum number of items per page in the transaction history.
            type: integer
            minimum: 1
            maximum: 100
            example: 100
          type:
            description: The type of transaction to return.
            type: string
            enum: [sell, buy, staking, fixed_staking, deposit, withdrawal, affiliate, distribution, internal_transfer, withdrawal_cancelled, rebate, loan, external_transferred_funds, manually_assigned]

    privateGetTransactionHistoryResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateGetTransactionHistory
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              currentPage:
                description: The current page number.
                type: integer
                example: 1
              totalPages:
                description: The total number of returned pages.
                type: integer
                example: 1
              maxItems:
                description: The maximum number of transactions per page.
                type: integer
                example: 100
              items:
                type: array
                items:
                  type: object
                  properties:
                    transactionId:
                      description: The unique identifier of the transaction.
                      type: string
                      example: '5f5e7b3b-4f5b-4b2d-8b2f-4f2b5b3f5e5f'
                    executedAt:
                      description: The Unix timestamp when the transaction was executed.
                      type: string
                      format: date-time
                      example: '2021-01-01T00:00:00.000Z'
                    type:
                      description: The type of transaction.
                      type: string
                      enum: [sell, buy, staking, fixed_staking, deposit, withdrawal, affiliate, distribution, internal_transfer, withdrawal_cancelled, rebate, loan, external_transferred_funds, manually_assigned, manually_assigned_bitvavo]
                    priceCurrency:
                      description: The currency in which the transaction was made.
                      type: string
                      example: EUR
                    priceAmount:
                      description: The amount of the transaction.
                      type: string
                      example: '1000.00'
                    sentCurrency:
                      description: The currency that was sent in the transaction.
                      type: string
                      example: EUR
                    sentAmount:
                      description: The amount that was sent in the transaction.
                      type: string
                      example: '0.1'
                    receivedCurrency:
                      description: The currency that was received in the transaction.
                      type: string
                      example: BTC
                    receivedAmount:
                      description: The amount that was received in the transaction.
                      type: string
                      example: '0.0001'
                    feesCurrency:
                      description: The currency in which the fees were paid.
                      type: string
                      example: EUR
                    feesAmount:
                      description: The amount of fees paid in the transaction.
                      type: string
                      example: '0.01'
                    address:
                      description: The address where the transaction was made.
                      type: string
                      nullable: true

