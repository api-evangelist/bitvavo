                example: NL89BANK0123456789

    privateWithdrawAssetsRequest:
      payload:
        type: object
        required:
          - symbol
          - amount
          - address
        properties:
          action:
            description: Set value to **privateWithdrawAssets**.
            type: string
            example: privateWithdrawAssets
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          symbol:
            type: string
            example: BTC
            description: The asset you want to withdraw.
          amount:
            description: The quantity of the asset to withdraw.
            type: string
            example: '1.5'
          address:
            description: |
              The address where to withdraw assets.
              <br/>
              > You can only withdraw to addresses which you have added and confirmed in your address book. Funds cannot be recovered after being withdrawn to the wrong address.
            type: string
            example: BitcoinAddress
          paymentId:
            description: |
              The unique identifier of the transaction of a digital asset. It is sometimes called *note*, *memo*, or *tag*.
              Should be specified when withdrawing straight to another exchange or merchants that require a `paymentId`.
            type: string
            example: '10002653'
          addWithdrawalFee:
            description: |
              Indicates if a fee is added in addition to the requested amount. If **false**, the fee is part of the requested amount and
              subtracted from the withdrawal.
            type: boolean
            default: false
          internal:
            description: '**Deprecated** Do not use or set to **false** to avoid errors.'
            type: boolean
            default: false
            deprecated: true

    privateWithdrawAssetsResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateWithdrawAssets
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              success:
                description: Indicates if the withdrawal request was successful.
                type: boolean
                example: true
              symbol:
                type: string
                example: BTC
                description: The asset that was withdrawn.
              amount:
                description: The total amount deducted from your balance.
                type: string
                example: '1.5'

    privateCryptoWithdrawalRequest:
      payload:
        type: object
        required:
          - asset
          - network
          - address
          - amount
        properties:
          action:
            description: Set value to **privateCryptoWithdrawal**.
            type: string
            example: privateCryptoWithdrawal
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          asset:
            type: string
            minLength: 1
            maxLength: 10
            example: SOL
            description: The asset you want to withdraw.
          network:
            type: string
            minLength: 1
            maxLength: 10
            example: SOL
            description: |
              The network you want to withdraw the asset to.
          address:
            type: string
            minLength: 1
            maxLength: 500
            example: BitcoinAddress
            description: |
              The address where to withdraw the asset to.
              <br/>
              > Make sure to check the address. Funds cannot be recovered after being withdrawn to the wrong address.
          amount:
            type: string
            example: '0.05'
            description: |
              The amount to withdraw as a decimal string.
          deductFeeFromAmount:
            type: boolean
            default: false
            description: |
              If **false** (default), the recipient receives the full `amount` and the fee is charged separately. If **true**, the fee is deducted from `amount` before it is sent.
          idempotencyKey:
            type: string
            minLength: 5
            maxLength: 50
            example: '111-06001'
            description: |
              Retries with the same key return the existing withdrawal when the request matches; otherwise the request is rejected.
          memo:
            type: string
            minLength: 1
            maxLength: 500
            description: |
              Memo or tag for networks that require it. Must match the one from the address book. Also known as *note* or *paymentId*.

    privateCryptoWithdrawalResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateCryptoWithdrawal
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              id:
                type: string
                description: The unique identifier of the withdrawal.
                example: 019e3a4e-8b29-732f-8d46-294828c1a40d
              asset:
                type: string
                minLength: 1
                maxLength: 10
                example: SOL
                description: The asset that was withdrawn.
              network:
                type: string
                minLength: 1
                maxLength: 10
                example: SOL
                description: The network the asset was withdrawn to.
              address:
                type: string
                minLength: 1
                maxLength: 500
                example: BitcoinAddress
                description: The address where the asset was withdrawn to.
              amount:
                type: string
                example: '0.0424'
                description: |
                  The amount that was withdrawn as a decimal string.
              fee:
                type: string
                example: '0.0076'
                description: The withdrawal fee as a decimal string.
              createdAt:
                type: string
                format: date-time
                example: '2026-05-18T08:58:06.538Z'
                description: The creation time of the withdrawal.

    privateGetWithdrawalHistoryRequest:
      payload:
        type: object
        properties:
          action:
            description: Set value to **privateGetWithdrawalHistory**.
            type: string
            example: privateGetWithdrawalHistory
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          symbol:
            description: The asset for which you want to retrieve past withdrawals. If not specified, all withdrawals are returned.
            type: string
            example: BTC
          limit:
            description: The maximum number of withdrawals to return, from latest to earliest.
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
          start:
            description: The Unix timestamp in milliseconds starting from which to return withdrawals.
            type: integer
            example: 1622548800000
          end:
            description: The Unix timestamp in milliseconds up to which to return withdrawals.
            type: integer
            example: 1622635200000

    privateGetWithdrawalHistoryResponse:
      payload:
        type: object
        properties:
          action:
            description: The action performed.
            type: string
            example: privateGetWithdrawalHistory
          requestId:
            description: Your identifier for the request.
            type: integer
            example: 1
          response:
            type: object
            properties:
              timestamp:
                description: The Unix timestamp in milliseconds when the withdrawal was made.
                type: integer
                example: 1542967486256
              symbol:
                type: string
                example: BTC
                description: The asset that was withdrawn.
              amount:
                description: The quantity of the asset that was withdrawn.
                type: string
                example: '0.99994'
              address:
                description: The address where the withdrawal was made.
                type: string
                example: BitcoinAddress
              paymentId:
                description: |
                  The unique identifier of the withdrawal. It is sometimes called *note*, *memo*, or *tag*. Not returned if not specified in the request.
                type: string
                example: '10002653'
              txId:
                description: The unique identifier of the transaction on the blockchain.
                type: string
                example: 927b3ea50c5bb52c6854152d305dfa1e27fc01d10464cf10825d96d69d235eb3
              fee:
                description: The [transaction fee](https://bitvavo.com/en/fees) for a withdrawal on Bitvavo.
                type: string
                example: '0.00006'
              status:
                description: The status of the withdrawal.
                type: string
                enum: [awaiting_processing, awaiting_email_confirmation, awaiting_bitvavo_inspection, approved, sending, in_mempool, processed, completed, canceled]

