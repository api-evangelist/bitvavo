      summary: Get trade history
      security:
      - Bitvavo-Access-Key: []
        Bitvavo-Access-Timestamp: []
        Bitvavo-Access-Signature: []
        Bitvavo-Access-Window: []
      description: 'Returns the specified number of past trades for your account and a time period of up to 24 hours. Does not return trades with a Price Guarantee.


        The returned trades are sorted by their `timestamp` in a descending order, from the latest to the earliest.


        :::info

        This is a *private* endpoint. To send requests, you need to authenticate.

        :::


        :::tip

        To get a specific list of trades, use the `start`, `end`, `tradeIdFrom`, and `tradeIdTo` parameters.

        ::::


        :::tip

        To get all past transactions for your account, use the Get transaction history request.

        ::::


        **Rate limit weight points**: **5**'
      parameters:
      - name: market
        in: query
        description: 'The market for which to return the past trades.

          '
        example: BTC-EUR
        required: true
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 'The maximum number of trades to return, from latest to earliest.

          '
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      - name: start
        required: false
        in: query
        description: 'The Unix timestamp starting from which to return trades.

          <br/>

          > Can only return trades for a period of up to 24 hours.

          '
        schema:
          type: integer
          format: unix-timestamp in milliseconds
          minimum: 0
      - name: end
        required: false
        in: query
        description: 'The Unix timestamp up to which to return trades.

          <br/>

          > Cannot be more than 24 hours after the `start` parameter. Can only return trades for a period of up to 24 hours.

          '
        schema:
          type: integer
          format: unix-timestamp in milliseconds
          maximum: 8640000000000000
      - name: tradeIdFrom
        in: query
        description: 'The unique identifier of the trade starting from which to return the trades.

          '
        required: false
        schema:
          type: string
      - name: tradeIdTo
        in: query
        description: 'The unique identifier of the trade up to which to return the trades.

          '
        required: false
        schema:
          type: string
