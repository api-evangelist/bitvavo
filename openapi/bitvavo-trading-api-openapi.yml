        source: 'import . "bitvavo" bitvavo := Bitvavo{ApiKey:"<APIKEY>", ApiSecret:"<APISECRET>"}

          response, err := bitvavo.Trades("BTC-EUR", map[string]string{}) if err != nil { fmt.Println(err) } else { for _, trade := range response { fmt.Printf("%+v\n", trade) } }'
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - operatorId
                  properties:
                    id:
                      description: 'The unique identifier of the fill.

                        '
                      type: string
                      example: 108c3633-0276-4480-a902-17a01829deae
                    orderId:
                      description: Bitvavo identifier of the order that was filled.
                      type: string
                      format: UUID
                      example: 1d671998-3d44-4df4-965f-0d48bd129a1b
                    clientOrderId:
                      description: 'Your identifier of the order that was filled.

                        '
                      type: string
                      format: UUID
                      example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
                    operatorId:
                      description: 'The identifier for the trader or the bot that made the request.

                        '
                      type: integer
                      format: int64
                      example: 543462
                    timestamp:
                      description: The Unix timestamp when the trade was made.
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1542967486256
                    market:
                      description: The market for which to return past trades.
                      type: string
                      example: BTC-EUR
                    side:
                      description: 'Indicates if the taker, who filled the order, is selling or buying.

                        '
                      type: string
                      enum:
                      - buy
                      - sell
                    amount:
                      description: 'The amount of base currency exchanged in the trade.

                        '
                      type: string
                      example: '0.005'
                    price:
                      description: 'The price of 1 unit of base currency in the amount of quote currency at the time of the trade.

                        '
                      type: string
                      example: '5000.1'
                    taker:
                      description: Indicates whether you are the taker for the fill.
