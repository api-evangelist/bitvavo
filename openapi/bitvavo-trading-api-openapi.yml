openapi: 3.2.0
info:
  title: Bitvavo REST Trading API
  version: 2.10.0
  description: Trading, market data, transfers, and account management using request-response messaging over HTTP.
servers:
- url: https://api.bitvavo.com/v2
tags:
- name: Trading
  description: Manage your orders and trades on Bitvavo.
paths:
  /order:
    post:
      tags:
      - Trading
      summary: Create order
      security:
      - Bitvavo-Access-Key: []
        Bitvavo-Access-Timestamp: []
        Bitvavo-Access-Signature: []
        Bitvavo-Access-Window: []
      description: 'Creates an order to buy or sell digital assets on Bitvavo.


        :::info

        This is a *private* endpoint. To send requests, you need to authenticate.

        :::


        :::warning

        You can have a maximum of 100 open orders at any one time in each `market`.

        ::::


        **Rate limit weight points**: **1**'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - side
              - orderType
              - operatorId
              properties:
                market:
                  type: string
                  example: BTC-EUR
                  description: 'The market in which to create the order.

                    '
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: 'Indicates whether the order is to buy or sell the asset.

                    '
                orderType:
                  type: string
                  enum:
                  - market
                  - limit
                  - stopLoss
                  - stopLossLimit
                  - takeProfit
                  - takeProfitLimit
                  description: "The type of order to create. Possible values:\n\n- `market`: an order to buy or sell digital assets at the current market `price`. \n- `limit`: an order to buy or sell digital assets at the specified `price` or better.\n- `stopLoss`: a market order to buy or sell digital assets when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.\n- `stopLossLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.\n- `takeProfit`: a market order to buy or sell digital assets when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.\n- `takeProfitLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.\n\n<br/>\n\n> For limit orders, you need to set `amount` and `price`. For market orders, you need to set either `amount` or `amountQuote`.\n"
                operatorId:
                  description: 'Your identifier for the trader or the bot within your account that made the request.

                    '
                  type: integer
                  format: int64
                  example: 543462
                clientOrderId:
                  type: string
                  format: UUID
                  description: 'Your identifier of the order. Must be unique across open orders.

                    '
                amount:
                  type: string
                  example: '1.567'
                  description: 'The quantity of the base currency to buy or sell. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.

                    '
                amountQuote:
                  type: string
                  example: '5000'
                  description: 'The quantity of the quote currency to buy or sell for the `market`, `stopLoss`, or `takeProfit` order types. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `notionalDecimals` field.

                    '
                price:
                  type: string
                  example: '6000'
                  description: 'The price in quote currency for which you want to buy or sell 1 unit of the base currency.


                    <br/>


                    > Must be a multiple of the `tickSize` value for the market. To get the `tickSize`, make a [Get markets](/docs/rest-api/get-markets/) request.

                    '
                triggerAmount:
                  type: string
                  example: '4000'
                  description: 'The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.

                    '
                triggerType:
                  type: string
                  enum:
                  - price
                  description: 'The type of trigger that fills the order when the condition is met.

                    '
                triggerReference:
                  type: string
                  enum:
                  - lastTrade
                  - bestBid
                  - bestAsk
                  - midPrice
                  description: 'The price which triggers the order to be filled for `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` types of orders.

                    '
                timeInForce:
                  type: string
                  enum:
                  - GTC
                  - IOC
                  - FOK
                  default: GTC
                  description: 'How long an order stays active for.

                    '
                postOnly:
                  type: boolean
                  default: false
                  description: 'If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.

                    '
                selfTradePrevention:
                  type: string
                  enum:
                  - cancelBoth
                  - cancelNewest
                  - cancelOldest
                  - decrementAndCancel
                  default: decrementAndCancel
                  description: "**[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.\n\nIndicates how to prevent self-trading for conflicting orders of any type.\n\nPossible values:\n- `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. \nFor example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.\n- `cancelOldest`: cancels the older conflicting order in the same market.\n- `cancelNewest`: cancels the later conflicting order in the same market.\n- `cancelBoth`: cancels both conflicting orders in the same market.\n"
                disableMarketProtection:
                  type: boolean
                  default: false
                  deprecated: true
                  description: 'Must be **false** because market protection can no longer be disabled.

                    '
                responseRequired:
                  type: boolean
                  default: true
                  description: 'Indicates whether the response returns all parameters (**true**) or only the HTTP status code (**false**).

                    '
                codGroupId:
                  type: integer
                  example: 1
                  minimum: 1
                  maximum: 1000
                  description: 'Your identifier for a group of orders.

                    '
      x-codeSamples:
      - lang: JavaScript
        source: "// The Javascript SDK works with callbacks and with promises. For info, check our GitHub.\nconst bitvavo = require('bitvavo')().options({\n  APIKEY: '<APIKEY>',\n  APISECRET: '<APISECRET>'\n})\n\nbitvavo.placeOrder('BTC-EUR', 'sell', 'limit', {\n  amount: '0.1',\n  price: '5000',\n  operatorId: 543462\n}, (error, response) => {\n  if (error === null) {\n    console.log(response)\n  } else {\n    console.log(error)\n  }\n})\n"
      - lang: Python
        source: "from python_bitvavo_api.bitvavo import Bitvavo\n\nbitvavo = Bitvavo({\n    'APIKEY': '<APIKEY>',\n    'APISECRET': '<APISECRET>'\n})\nresponse = bitvavo.placeOrder('BTC-EUR', 'sell', 'limit', { 'amount': '0.1', 'price': '5000', 'operatorId': 543462 })\nprint(response)\n"
      - lang: Go
        source: "import . \"bitvavo\"\nbitvavo := Bitvavo{ApiKey:\"<APIKEY>\", ApiSecret:\"<APISECRET>\"}\n\nresponse, err := bitvavo.PlaceOrder(\"BTC-EUR\", \"sell\", \"limit\", map[string]string{\n    \"price\": \"5000\",\n    \"operatorId\": \"543462\",\n})\nif err != nil {\n    fmt.Println(err)\n} else {\n    fmt.Printf(\"%+v\\n\", response)\n}"
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: The number of available [weight points](/docs/rate-limits) in one minute.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                - title: responseRequired=true
                  type: object
                  properties:
                    orderId:
                      type: string
                      format: UUID
                      description: 'Bitvavo identifier of the order. An `orderId` is unique per `market`. Different markets can use the same `orderId` values.

                        '
                      example: 1be6d0df-d5dc-4b53-a250-3376f3b393e6
                    clientOrderId:
                      description: 'Your identifier of the order. Only returned if specified in the request.

                        '
                      type: string
                      format: UUID
                      example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
                    market:
                      type: string
                      example: BTC-EUR
                      description: 'The market where you created an order.

                        '
                    created:
                      description: 'The Unix timestamp when the order was created.

                        '
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1706100650751
                    updated:
                      description: 'The Unix timestamp when the order was last updated.

                        '
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1706100650751
                    status:
                      description: "The status of an order. Possible values:\n- `new`: the `orderId` has been added to the order book and has not been filled.\n- `awaitingTrigger`: the conditions to fill an order haven't been met. \n- `canceled`: the `orderId` has been removed from the order book. \n- `expired`: the market order expires because there is no match, enough liquidity in the order book, or enough balance in your account.\n- `filled`: all trades necessary to complete the order have been filled. \n- `partiallyFilled`: the order is still active. Bitvavo needs to receive more matching orders to completely fill the order.  \n"
                      type: string
                      enum:
                      - new
                      - awaitingTrigger
                      - canceled
                      - expired
                      - filled
                      - partiallyFilled
                    side:
                      description: 'Indicates whether the order is to buy or sell the asset.

                        '
                      type: string
                      enum:
                      - buy
                      - sell
                    orderType:
                      description: 'The type of order you created.

                        '
                      type: string
                      enum:
                      - limit
                      - market
                    amount:
                      description: 'The quantity of the base currency to buy or sell.

                        If you set `amountQuote` in your order, `amount` is not returned.

                        '
                      type: string
                      example: '10'
                    amountRemaining:
                      description: 'The quantity of the base currency remaining after the sum of fills is subtracted from the `amount`.

                        If you set `amountQuote` in your order, `amountRemaining` is not returned.

                        '
                      type: string
                      example: '10'
                    price:
                      description: 'The price you set for a `limit`, `stopLossLimit`, `takeProfit`, or a `takeProfitLimit` order.

                        For other types of orders, the `price` is not returned.

                        '
                      type: string
                      example: '7000'
                    amountQuote:
                      description: "The quantity of the quote currency to buy or sell for the market, `stopLoss`, or `takeProfit` types of order. \nIf you set `amount` in your order, `amountQuote` is not returned.\n"
                      type: string
                      example: '5000'
                    amountQuoteRemaining:
                      description: "The quantity of the quote currency remaining after the sum of all fills is \nsubtracted from `amountQuote`.\n\nIf you set `amount` in the order, `amountQuoteRemaining` is not returned.\n"
                      type: string
                      example: '5000'
                    onHold:
                      description: 'The amount of `onHoldCurrency` locked while an order is not yet `settled` after an order is filled.

                        All funds are released when order is filled.

                        '
                      type: string
                      example: '70000'
                    onHoldCurrency:
                      description: 'The currency that is `onHold` while the order is processed. This depends on the `side` you set for the `orderId`.

                        '
                      type: string
                      example: EUR
                    triggerPrice:
                      description: "The price calculated using `triggerAmount` and \n`triggerType` for the `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` \ntypes of orders.   \n\nFor example, when you set `triggerAmount` to 4000 and `triggerType` to `price`, your order is placed in a `market` \nwhen the `triggerReference` price in quote currency reaches 4000.\n"
                      type: string
                      example: '4000'
                    triggerAmount:
                      description: "The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.  \nThis value and `triggerType` are used to calculate `triggerPrice`.\n"
                      type: string
                      example: '4000'
                    triggerType:
                      description: 'The type of trigger you set to fill the order when the condition is met. This value and `triggerAmount` are used to calculate `triggerPrice`.

                        '
                      type: string
                      enum:
                      - price
                    triggerReference:
                      description: 'The price you set to trigger the order to be filled for the `stopLoss`, `stopLossLimit`, `takeProfit`, or  `takeProfitLimit` types of orders.

                        '
                      type: string
                      enum:
                      - lastTrade
                      - bestBid
                      - bestAsk
                      - midPrice
                    filledAmount:
                      description: The total amount bought or sold in base currency.
                      type: string
                      example: '0'
                    filledAmountQuote:
                      description: The total amount bought or sold in quote currency.
                      type: string
                      example: '0'
                    feePaid:
                      description: 'The amount you pay Bitvavo to process the order. This value is negative for rebates. For more information, see

                        GET [/account/fees](/docs/rest-api/get-market-fees).

                        '
                      type: string
                      example: '0'
                    feeCurrency:
                      description: The currency of the `feePaid`.
                      type: string
                      example: EUR
                    fills:
                      description: 'The fill generated by the update order request.

                        '
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            description: The identifier of this fill.
                            type: string
                            example: 371c6bd3-d06d-4573-9f15-18697cd210e5
                          timestamp:
                            description: 'A Unix timestamp when Bitvavo processed the fill.

                              '
                            type: integer
                            format: unix-timestamp in milliseconds
                            example: 1542967486256
                          amount:
                            description: The amount of base currency exchanged in the fill.
                            type: string
                            example: '0.005'
                          price:
                            description: The price of the fill in quote currency.
                            type: string
                            example: '5000.1'
                          taker:
                            description: Returns `true` when you are the taker for the fill.
                            type: boolean
                            example: true
                          fee:
                            description: "The amount you pay Bitvavo in `feeCurrency` to process the fill. For more information about your fees, see \nGET [/account/fees](/docs/rest-api/get-market-fees). This value is negative for rebates.\n \nIf `settled` is `false`, this parameter is not included in the return parameters.\n"
                            type: string
                            example: '0.03'
                          feeCurrency:
                            description: 'The currency that the `fee` is paid in.


                              If `settled` is `false`, this object is not returned.

                              '
                            type: string
                            example: EUR
                          settled:
                            description: "On Bitvavo, trade settlement happens after an order is filled. When the fill is complete and the `fee` is not yet \npaid, `settled` is `false`.\n"
                            type: boolean
                    selfTradePrevention:
                      description: 'Indicates how to prevent self-trading for conflicting orders of any type.

                        '
                      type: string
                      enum:
                      - decrementAndCancel
                      - cancelOldest
                      - cancelNewest
                      - cancelBoth
                    visible:
                      description: 'Returns `true` when the `orderId` is visible in the [order book](/docs/rest-api/get-order-book) for a `market`.

                        '
                      type: boolean
                    timeInForce:
                      description: 'The value you set for how long an order stays active.

                        '
                      type: string
                      enum:
                      - GTC
                      - IOC
                      - FOK
                    postOnly:
                      description: 'If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.

                        '
                      type: boolean
                    disableMarketProtection:
                      description: 'Must be **false** because market protection can no longer be disabled.

                        '
                      type: boolean
                      deprecated: true
                    operatorId:
                      description: 'Your identifier for the trader or the bot within your account that made the request.

                        '
                      type: integer
                      format: int64
                      example: 543462
                    restatementReason:
                      description: 'Specifies the reason why the status of the order was changed. For example when an order is canceled by the [Price protection checks](/docs/order-lifecycle/#price-protection).

                        '
                      type: string
                      enum:
                      - decrementOnSelfTradePrevention
                      - cancelOnSelfTradePrevention
                      - cancelOnPlacementPriceProtection
                      - cancelOnExecutionPriceProtection
                      - cancelOnSpreadProtection
                      - cancelOnReferencePriceProtection
                      - cancelPostOnlyOnAuctionMatching
                      - cancelOnMaintenance
                      - cancelOnDisconnect
                      - cancelOnDelisting
                      - cancelOnLockPlaced
                      - cancelOnAdminRequest
                      - cancelPostOnly
                    createdNs:
                      description: 'The Unix timestamp in nanoseconds when the order was created.

                        '
                      type: integer
                      format: unix-timestamp in nanoseconds
                      example: 1752139200000000000
                    updatedNs:
                      description: 'The Unix timestamp in nanoseconds when the order was last updated.

                        '
                      type: integer
                      format: unix-timestamp in nanoseconds
                      example: 1752139200000000000
                    codGroupId:
                      type: integer
                      example: 1
                      description: 'Your identifier for a group of orders.

                        '
                - title: responseRequired=false
                  type: object
                  properties:
                    market:
                      type: string
                      example: BTC-EUR
                      description: 'The market where you created an order.

                        '
                    orderId:
                      type: string
                      format: UUID
                      description: 'Bitvavo identifier of the order. An `orderId` is unique per `market`. Different markets can use the same `orderId` values.

                        '
                      example: 1be6d0df-d5dc-4b53-a250-3376f3b393e6
                    clientOrderId:
                      description: 'Your identifier of the order. Only returned if specified in the request.

                        '
                      type: string
                      format: UUID
                      example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
                    created:
                      description: 'The Unix timestamp when the order was created.

                        '
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1706100650751
                    updated:
                      description: 'The Unix timestamp when the order was last updated.

                        '
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1706100650751
                    createdNs:
                      description: 'The Unix timestamp in nanoseconds when the order was created.

                        '
                      type: integer
                      format: unix-timestamp in nanoseconds
                      example: 1752139200000000000
                    updatedNs:
                      description: 'The Unix timestamp in nanoseconds when the order was last updated.

                        '
                      type: integer
                      format: unix-timestamp in nanoseconds
                      example: 1752139200000000000
        4XX:
          description: For error codes, see [Handle errors](/docs/errors).
      operationId: postOrder
      x-operation-id-source: derived
    put:
      tags:
      - Trading
      summary: Update order
      security:
      - Bitvavo-Access-Key: []
        Bitvavo-Access-Timestamp: []
        Bitvavo-Access-Signature: []
        Bitvavo-Access-Window: []
      description: 'Updates an existing *limit* or *trigger* order.


        :::info

        This is a *private* endpoint. To send requests, you need to authenticate.

        :::


        :::info

        You must set either `orderId` or `clientOrderId`. If you set both, we use the `clientOrderId` to identify the order. `clientOrderId` is only returned if you set it when you created the order.

        :::


        :::tip

        Updating an order is faster than canceling and creating new orders. During the update, your order is briefly removed from the order book.

        :::


        **Rate limit weight points**: 1.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - operatorId
              properties:
                market:
                  description: The market in which to update an order.
                  type: string
                  example: BTC-EUR
                orderId:
                  description: 'Bitvavo identifier of the order to update.

                    '
                  type: string
                  format: UUID
                  example: 95d92d6c-ecf0-4960-a608-9953ef71652e
                operatorId:
                  description: 'Your identifier for the trader or the bot within your account that made the request.

                    '
                  type: integer
                  format: int64
                  example: 543462
                clientOrderId:
                  description: 'Your identifier of the order to update. Must be unique among open orders.


                    <br/>


                    > If both `clientOrderId` and `orderId` are set, we use the `clientOrderId` to identify the order.

                    '
                  type: string
                  format: UUID
                  example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
                amount:
                  description: "The amount of base currency to update. Specifying the `amount` automatically adjusts the `amountRemaining`. \n\n<br/>\n\nTo get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.\n"
                  type: string
                  example: '1.567'
                amountQuote:
                  description: "**Only for `takeProfit` and `stopLoss` orders that are not triggered yet**. The amount of quote currency to buy or sell at the best available price. \n\n<br/>\n\n> To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `notionalDecimals` field.\n"
                  type: string
                  example: '5000'
                amountRemaining:
                  description: 'The remaining amount of base currency to update. Specifying the `amountRemaining` automatically adjusts the `amount`.


                    <br/>


                    > We discourage updating the `amountRemaining` because you can end up buying or selling more than you intended.

                    '
                  type: string
                  example: '1.560'
                price:
                  description: 'The amount of quote currency for 1 unit of the base currency.


                    <br/>


                    > Must be a multiple of the `tickSize` value for the market. To get the `tickSize`, make a [Get markets](/docs/rest-api/get-markets/) request.

                    '
                  type: string
                  example: '6000'
                triggerAmount:
                  description: '**Only for stop orders**. The price at which you want to buy or sell 1 unit of the base currency in the quote currency.


                    <br/>


                    > You can only update orders that have not been triggered yet.

                    '
                  type: string
                  example: '4000'
                timeInForce:
                  description: "How long an `orderType` stays active for. Possible values:\n\n- `FOK`: *Fill-Or-Kill*. Fills the entire order from existing orders, or cancels the entire order.\n- `GTC`: *Good-Til-Canceled*. Stays in the order book until the entire order is filled or you manually cancel it. \n- `IOC`: *Immediate-Or-Cancel*. Fills existing orders and cancels the unfilled balance.\n\n<br/>\n\n> You can only update orders that have not been triggered yet.\n"
                  type: string
                  enum:
                  - GTC
                  - IOC
                  - FOK
                selfTradePrevention:
                  description: "**[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.\n\nIndicates how to prevent self-trading for conflicting orders of any type.\n\nPossible values:\n- `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. \nFor example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.\n- `cancelOldest`: cancels the older conflicting order in the same market.\n- `cancelNewest`: cancels the later conflicting order in the same market.\n- `cancelBoth`: cancels both conflicting orders in the same market.\n"
                  type: string
                  enum:
                  - decrementAndCancel
                  - cancelOldest
                  - cancelNewest
                  - cancelBoth
                postOnly:
                  description: 'If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.

                    '
                  type: boolean
                responseRequired:
                  description: 'Indicates whether the response returns all parameters (**true**) or only the HTTP status code (**false**).

                    '
                  type: boolean
                  default: true
      x-codeSamples:
      - lang: JavaScript
        source: "// The Javascript SDK works with callbacks and with promises. For info, check our GitHub.\nconst bitvavo = require('bitvavo')().options({\n  APIKEY: '<APIKEY>',\n  APISECRET: '<APISECRET>'\n})\n\nbitvavo.updateOrder('BTC-EUR', 'b0d39267-f628-43ed-8ab7-1df502d80a7a', { 'amount': '0.2', 'operatorId': 543462 }, (error, response) => {\n  if (error === null) {\n    console.log(response)\n  } else {\n    console.log(error)\n  }\n})\n"
      - lang: Python
        source: "from python_bitvavo_api.bitvavo import Bitvavo\n\nbitvavo = Bitvavo({\n    'APIKEY': '<APIKEY>',\n    'APISECRET': '<APISECRET>'\n})\nresponse = bitvavo.updateOrder('BTC-EUR', 'a4a5d310-687c-486e-a3eb-1df832405ccd', { 'amount': '1.1', 'operatorId': 543462 })\nprint(response)\n"
      - lang: Go
        source: "import . \"bitvavo\"\nbitvavo := Bitvavo{ApiKey:\"<APIKEY>\", ApiSecret:\"<APISECRET>\"}\n\nresponse, err := bitvavo.UpdateOrder(\"BTC-EUR\", \"58496625-6764-4765-bec9-cfc6cb80238e\", map[string]string{\n    \"price\": \"5000\",\n    \"operatorId\": \"543462\",\n})\nif err != nil {\n  fmt.Println(err)\n} else {\n  fmt.Printf(\"%+v\\n\", response)\n}\n"
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: The number of available [weight points](/docs/rate-limits) in one minute.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                - title: responseRequired=true
                  type: object
                  properties:
                    orderId:
                      type: string
                      format: UUID
