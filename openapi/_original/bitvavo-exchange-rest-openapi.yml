  /order:
    post:
      tags:
        - Trading
      summary: Create order
      security:
        - Bitvavo-Access-Key: []
          Bitvavo-Access-Timestamp: []
          Bitvavo-Access-Signature: []
          Bitvavo-Access-Window: []
      description: |
        Creates an order to buy or sell digital assets on Bitvavo.

        :::info
        This is a *private* endpoint. To send requests, you need to [authenticate](/docs/rest-api/introduction/).
        ::: 

        :::warning
        You can have a maximum of [100 open orders](/docs/rest-api/get-orders) at any one time in each `market`. 
        ::::

        **Rate limit weight points**: **1**
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - side
                - orderType
                - operatorId
              properties:
                market:
                  type: string
                  example: BTC-EUR
                  description: |
                    The market in which to create the order.
                side:
                  type: string
                  enum:
                    - buy
                    - sell
                  description: |
                    Indicates whether the order is to buy or sell the asset.
                orderType:
                  type: string
                  enum:
                    - market
                    - limit
                    - stopLoss
                    - stopLossLimit
                    - takeProfit
                    - takeProfitLimit
                  description: |
                    The type of order to create. Possible values:

                    - `market`: an order to buy or sell digital assets at the current market `price`. 
                    - `limit`: an order to buy or sell digital assets at the specified `price` or better.
                    - `stopLoss`: a market order to buy or sell digital assets when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.
                    - `stopLossLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is worse or equal to your stop price. Worse means lower for sell orders and higher for buy orders.
                    - `takeProfit`: a market order to buy or sell digital assets when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.
                    - `takeProfitLimit`: a limit order to buy or sell digital assets at the specified `price` or better when the market price is better or equal to your stop price. Better means higher for sell orders and lower for buy orders.

                    <br/>

                    > For limit orders, you need to set `amount` and `price`. For market orders, you need to set either `amount` or `amountQuote`.
                operatorId:
                  description: |
                    Your identifier for the trader or the bot within your account that made the request.
                  type: integer
                  format: int64
                  example: 543462
                clientOrderId:
                  type: string
                  format: UUID
                  description: |
                    Your identifier of the order. Must be unique across open orders.
                amount:
                  type: string
                  example: '1.567'
                  description: |
                    The quantity of the base currency to buy or sell. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `quantityDecimals` field.
                amountQuote:
                  type: string
                  example: '5000'
                  description: |
                    The quantity of the quote currency to buy or sell for the `market`, `stopLoss`, or `takeProfit` order types. To get the number of allowed decimals, make a [Get markets](/docs/rest-api/get-markets/) request and check the `notionalDecimals` field.
                price:
                  type: string
                  example: '6000'
                  description: |
                    The price in quote currency for which you want to buy or sell 1 unit of the base currency.

                    <br/>

                    > Must be a multiple of the `tickSize` value for the market. To get the `tickSize`, make a [Get markets](/docs/rest-api/get-markets/) request.
                triggerAmount:
                  type: string
                  example: '4000'
                  description: |
                    The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.
                triggerType:
                  type: string
                  enum:
                    - price
                  description: |
                    The type of trigger that fills the order when the condition is met.
                triggerReference:
                  type: string
                  enum:
                    - lastTrade
                    - bestBid
                    - bestAsk
                    - midPrice
                  description: |
                    The price which triggers the order to be filled for `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` types of orders.
                timeInForce:
                  type: string
                  enum:
                    - GTC
                    - IOC
                    - FOK
                  default: GTC
                  description: |
                    How long an order stays active for.
                postOnly:
                  type: boolean
                  default: false
                  description: |
                    If true, cancels limit orders that match immediately. This ensures you pay the maker fee and not the taker fee.
                selfTradePrevention:
                  type: string
                  enum:
                    - cancelBoth
                    - cancelNewest
                    - cancelOldest
                    - decrementAndCancel
                  default: decrementAndCancel
                  description: |
                    **[Self-trading is not allowed on Bitvavo](https://bitvavo.com/en/trading-rules)**.

                    Indicates how to prevent self-trading for conflicting orders of any type.

                    Possible values:
                    - `decrementAndCancel`: (default) decreases the amount in the conflicting order by the difference between the buy and sell orders in the same market. Cancels the lower order. 
                    For example, if a sell order is for 500 BTC and a buy order is for 300 BTC, it cancels the buy order and adjusts the sell order to 200 BTC.
                    - `cancelOldest`: cancels the older conflicting order in the same market.
                    - `cancelNewest`: cancels the later conflicting order in the same market.
                    - `cancelBoth`: cancels both conflicting orders in the same market.
                disableMarketProtection:
                  type: boolean
                  default: false
                  deprecated: true
                  description: |
                    Must be **false** because market protection can no longer be disabled.
                responseRequired:
                  type: boolean
                  default: true
                  description: |
                    Indicates whether the response returns all parameters (**true**) or only the HTTP status code (**false**).
                codGroupId:
                  type: integer
                  example: 1
                  minimum: 1
                  maximum: 1000
                  description: |
                    Your identifier for a group of orders.
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')().options({
              APIKEY: '<APIKEY>',
              APISECRET: '<APISECRET>'
            })

            bitvavo.placeOrder('BTC-EUR', 'sell', 'limit', {
              amount: '0.1',
              price: '5000',
              operatorId: 543462
            }, (error, response) => {
              if (error === null) {
                console.log(response)
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo({
                'APIKEY': '<APIKEY>',
                'APISECRET': '<APISECRET>'
            })
            response = bitvavo.placeOrder('BTC-EUR', 'sell', 'limit', { 'amount': '0.1', 'price': '5000', 'operatorId': 543462 })
            print(response)
        - lang: Go
          source: |-
            import . "bitvavo"
            bitvavo := Bitvavo{ApiKey:"<APIKEY>", ApiSecret:"<APISECRET>"}

            response, err := bitvavo.PlaceOrder("BTC-EUR", "sell", "limit", map[string]string{
                "price": "5000",
                "operatorId": "543462",
            })
            if err != nil {
                fmt.Println(err)
            } else {
                fmt.Printf("%+v\n", response)
            }
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: 'The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.'
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: 'The number of available [weight points](/docs/rate-limits) in one minute.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                  - title: "responseRequired=true"
                    type: object
                    properties:
                      orderId:
                        type: string
                        format: UUID
                        description: |
                          Bitvavo identifier of the order. An `orderId` is unique per `market`. Different markets can use the same `orderId` values.
                        example: 1be6d0df-d5dc-4b53-a250-3376f3b393e6
                      clientOrderId:
                        description: |
                          Your identifier of the order. Only returned if specified in the request.
                        type: string
                        format: UUID
                        example: 2be7d0df-d8dc-7b93-a550-8876f3b393e9
                      market:
                        type: string
                        example: BTC-EUR
                        description: |
                          The market where you created an order.
                      created:
                        description: |
                          The Unix timestamp when the order was created.
                        type: integer
                        format: unix-timestamp in milliseconds
                        example: 1706100650751
                      updated:
                        description: |
                          The Unix timestamp when the order was last updated.
                        type: integer
                        format: unix-timestamp in milliseconds
                        example: 1706100650751
                      status:
                        description: |
                          The status of an order. Possible values:
                          - `new`: the `orderId` has been added to the order book and has not been filled.
                          - `awaitingTrigger`: the conditions to fill an order haven't been met. 
                          - `canceled`: the `orderId` has been removed from the order book. 
                          - `expired`: the market order expires because there is no match, enough liquidity in the order book, or enough balance in your account.
                          - `filled`: all trades necessary to complete the order have been filled. 
                          - `partiallyFilled`: the order is still active. Bitvavo needs to receive more matching orders to completely fill the order.  
                        type: string
                        enum:
                          - new
                          - awaitingTrigger
                          - canceled
                          - expired
                          - filled
                          - partiallyFilled
                      side:
                        description: |
                          Indicates whether the order is to buy or sell the asset.
                        type: string
                        enum:
                          - buy
                          - sell
                      orderType:
                        description: |
                          The type of order you created.
                        type: string
                        enum:
                          - limit
                          - market
                      amount:
                        description: |
                          The quantity of the base currency to buy or sell.
                          If you set `amountQuote` in your order, `amount` is not returned.
                        type: string
                        example: '10'
                      amountRemaining:
                        description: |
                          The quantity of the base currency remaining after the sum of fills is subtracted from the `amount`.
                          If you set `amountQuote` in your order, `amountRemaining` is not returned.
                        type: string
                        example: '10'
                      price:
                        description: |
                          The price you set for a `limit`, `stopLossLimit`, `takeProfit`, or a `takeProfitLimit` order.
                          For other types of orders, the `price` is not returned.
                        type: string
                        example: '7000'
                      amountQuote:
                        description: |
                          The quantity of the quote currency to buy or sell for the market, `stopLoss`, or `takeProfit` types of order. 
                          If you set `amount` in your order, `amountQuote` is not returned.
                        type: string
                        example: '5000'
                      amountQuoteRemaining:
                        description: |
                          The quantity of the quote currency remaining after the sum of all fills is 
                          subtracted from `amountQuote`.

                          If you set `amount` in the order, `amountQuoteRemaining` is not returned.
                        type: string
                        example: '5000'
                      onHold:
                        description: |
                          The amount of `onHoldCurrency` locked while an order is not yet `settled` after an order is filled.
                          All funds are released when order is filled.
                        type: string
                        example: '70000'
                      onHoldCurrency:
                        description: |
                          The currency that is `onHold` while the order is processed. This depends on the `side` you set for the `orderId`.
                        type: string
                        example: EUR
                      triggerPrice:
                        description: |
                          The price calculated using `triggerAmount` and 
                          `triggerType` for the `stopLoss`, `stopLossLimit`, `takeProfit`, or `takeProfitLimit` 
                          types of orders.   

                          For example, when you set `triggerAmount` to 4000 and `triggerType` to `price`, your order is placed in a `market` 
                          when the `triggerReference` price in quote currency reaches 4000.
                        type: string
                        example: '4000'
                      triggerAmount:
                        description: |
                          The trigger price in quote currency for which you want to buy or sell 1 unit of the base currency.  
                          This value and `triggerType` are used to calculate `triggerPrice`.
                        type: string
                        example: '4000'
                      triggerType:
                        description: |
                          The type of trigger you set to fill the order when the condition is met. This value and `triggerAmount` are used to calculate `triggerPrice`.
                        type: string
                        enum:
                          - price
                      triggerReference:
                        description: |
                          The price you set to trigger the order to be filled for the `stopLoss`, `stopLossLimit`, `takeProfit`, or  `takeProfitLimit` types of orders.
                        type: string
                        enum:
                          - lastTrade
                          - bestBid
                          - bestAsk
                          - midPrice
                      filledAmount:
                        description: The total amount bought or sold in base currency.
                        type: string
                        example: '0'
                      filledAmountQuote:
                        description: The total amount bought or sold in quote currency.
                        type: string
                        example: '0'
                      feePaid:
                        description: |
                          The amount you pay Bitvavo to process the order. This value is negative for rebates. For more information, see
                          GET [/account/fees](/docs/rest-api/get-market-fees).
                        type: string
                        example: '0'
                      feeCurrency:
                        description: The currency of the `feePaid`.
                        type: string
                        example: EUR
                      fills:
                        description: |
                          The fill generated by the update order request.
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: The identifier of this fill.
                              type: string
                              example: 371c6bd3-d06d-4573-9f15-18697cd210e5
                            timestamp:
                              description: |
                                A Unix timestamp when Bitvavo processed the fill.
                              type: integer
                              format: unix-timestamp in milliseconds
                              example: 1542967486256
                            amount:
                              description: The amount of base currency exchanged in the fill.
                              type: string
                              example: '0.005'
                            price:
                              description: The price of the fill in quote currency.
                              type: string
                              example: '5000.1'
                            taker:
                              description: Returns `true` when you are the taker for the fill.
                              type: boolean
                              example: true
                            fee:
                              description: |
                                The amount you pay Bitvavo in `feeCurrency` to process the fill. For more information about your fees, see 
                                GET [/account/fees](/docs/rest-api/get-market-fees). This value is negative for rebates.
                                 
                                If `settled` is `false`, this parameter is not included in the return parameters.
                              type: string
                              example: '0.03'
                            feeCurrency:
                              description: |
