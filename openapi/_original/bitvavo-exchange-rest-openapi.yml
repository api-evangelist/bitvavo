  /cancelOrdersAfter:
    post:
      tags:
        - Trading
      summary: Cancel orders after
      security:
        - Bitvavo-Access-Key: []
          Bitvavo-Access-Timestamp: []
          Bitvavo-Access-Signature: []
          Bitvavo-Access-Window: []
      description: "Creates an identifier used to group open orders and sets the countdown timer after which those orders are automatically canceled.\n\nTo learn how to use this endpoint, see [Cancel on disconnect](/docs/cancel-on-disconnect/).\n\n:::info\nThis is a *private* endpoint. To send requests, you need to [authenticate](/docs/rest-api/introduction/).\n::: \n\n:::info\n\U0001F4A1You can create only one group. If you need to create multiple groups, reach out to your Bitvavo contact to enable this.\n:::\n\n**Rate limit weight points**: **5**\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - codGroupId
                - expiryAfterSeconds
              properties:
                codGroupId:
                  type: integer
                  example: 1
                  minimum: 1
                  maximum: 1000
                  description: |
                    Your identifier for a [group of orders](/docs/rest-api/cancel-orders-after/).
                expiryAfterSeconds:
                  type: integer
                  example: 30
                  minimum: 10
                  maximum: 300
                  description: |
                    Your countdown timer in seconds after which open orders are canceled.
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: 'The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.'
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: 'The number of available [weight points](/docs/rate-limits) in one minute.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  codGroupId:
                    type: integer
                    example: 1
                    description: |
                      Your identifier for a [group of orders](/docs/rest-api/cancel-orders-after/).
                  timeOfExpirySeconds:
                    type: integer
                    format: unix-timestamp in seconds
                    example: 17202139111
                    description: |
                      Your countdown timer in seconds after which open orders are canceled.
        4XX:
          description: 'For error codes, see [Handle errors](/docs/errors).'
