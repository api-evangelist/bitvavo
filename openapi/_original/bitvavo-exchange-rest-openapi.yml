  /ticker/price:
    get:
      tags:
        - Market data
      summary: Get ticker prices
      description: |
        Returns prices of the latest trades on Bitvavo for all markets or a single `market`. 

        :::info
        This is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).
        :::

        :::note
        A _tick_ in a market is any change in the price of a digital asset.
        :::

        **Rate limit weight points**: 1
      parameters:
        - name: market
          in: query
          example: BTC-EUR
          description: |
            The market for which to return the latest information.

            > For the list of all markets on Bitvavo, make a [Get markets](/docs/rest-api/get-markets) request.
          required: false
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            bitvavo.tickerPrice({}, (error, response) => {
              if (error === null) {
                console.log('Current price for', response.market, ':', response.price)
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo()
            response = bitvavo.tickerPrice({})
            for market in response:
              print(market)
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.TickerPrice(map[string]string{}) if err != nil { fmt.Println(err) } else { for _, price := range response { fmt.Printf("%+v\n", price) } }
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    market:
                      description: The market for which you requested the latest trade price.
                      type: string
                      example: BTC-EUR
                    price:
                      description: 'The latest trade price for 1 unit of base currency in the amount of quote currency for the specified `market`. For example, **34243** Euro.'
                      type: string
                      example: '34,243'
        4XX:
          description: 'For error codes, see [Handle errors](/docs/errors).'
  /ticker/book:
    get:
      tags:
        - Market data
      summary: Get ticker book
      description: |
        Returns the highest buy and the lowest sell prices currently available for all markets, or a single `market`, in the Bitvavo order book.

        :::info
        This is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).
        :::
        **Rate limit weight points**: 1
      parameters:
        - name: market
          in: query
          example: BTC-EUR
          description: |
            The market for which to return the latest information.

            > For the list of all markets on Bitvavo, make a [Get markets](/docs/rest-api/get-markets) request.
          required: false
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            bitvavo.tickerBook({}, (error, response) => {
              if (error === null) {
                console.log(response.market, 'book, bid:', response.bid, ' ask:', response.ask)
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo()
            response = bitvavo.tickerBook({})
            for market in response:
              print(market)
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.TickerBook(map[string]string{}) if err != nil { fmt.Println(err) } else { for _, book := range response { fmt.Printf("%+v\n", book) } }
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    market:
                      description: The market for which you requested the current best bid and ask information.
                      type: string
                      example: BTC-EUR
                    bid:
                      description: |
