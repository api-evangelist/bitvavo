# x-archived-from: bitvavo-exchange-rest-openapi.yml
# x-archived-on: 2026-10-13
openapi: 3.0.2
info:
  title: Bitvavo REST API
  version: 2.10.0
  description: |
    Trading, market data, transfers, and account management using request-response messaging over HTTP.
tags:
  - name: Market data
    description: 'Get the latest information about markets, trades, and candles on Bitvavo.'
  - name: Trading
    description: |
      Manage your orders and trades on Bitvavo.
  - name: Transfer
    description: |
      Deposit and withdraw funds on Bitvavo.
  - name: Account
    description: |
      Get information about your Bitvavo account.
  - name: Synchronization
    description: |
      Synchronize markets and assets data with your app.
paths:
  '/{market}/book':
    get:
      tags:
        - Market data
      summary: Get order book
      description: "Returns the list of up to 1000 bids and asks per request for the specified\_`market`, sorted by\_`price`.\n\n:::info\nThis is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).\n:::\n**Rate limit weight points**: 1\n"
      parameters:
        - name: market
          description: |
            The market for which to return the order book.
          in: path
          required: true
          example: BTC-EUR
          schema:
            type: string
        - name: depth
          description: |
            The number of `bids` and `asks` to return.
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            default: 1000
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            bitvavo.book('BTC-EUR', {}, (error, response) => {
              if (error === null) {
                for (let entry of response.bids) {
                  console.log('Bids: ', entry)
                }
                for (let entry of response.asks) {
                  console.log('Asks: ', entry)
                }
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo()
            response = bitvavo.book('BTC-EUR', {})
            for item in response['bids']:
              print('Bids', item)
            for item in response['asks']:
              print('Asks', item)
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.Book("BTC-EUR", map[string]string{}) if err != nil { fmt.Println(err) } else { fmt.Printf("%+v\n", response) }
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: 'The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.'
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: 'The number of available [weight points](/docs/rate-limits) in one minute.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  market:
                    description: The market for which the order book is returned.
                    type: string
                    example: BTC-EUR
                  nonce:
                    description: |
                      Unique identifier of the market data in the order book at a specific time. `nonce` is incremented by 1 every time the order book changes.
                      For example, when an order is placed, updated, or deleted.
                    type: integer
                    example: 438524
                  bids:
                    type: array
                    description: |
                      The list of buy orders for the specified `market` and `depth`. Every bid contains:

                      - `price`: the offer for 1 unit of base currency in the amount of quote currency. For 
                      example, **34243** Euros.

                      - `size`: the amount of base currency in the offer. For example, **0.1** Bitcoin.
                    items:
                      type: array
                      items:
                        type: string
                    example:
                      - - '4999.9'
                        - '0.015'
                      - - '4999.8'
                        - '0.015'
                      - - '4999.7'
                        - '0.015'
                      - - '4999.6'
                        - '0.015'
                  asks:
                    type: array
                    description: |
                      The list of sell orders for the specified `market` and `depth`. Every bid contains:

                        - `price`: the offer for 1 unit of base currency in the amount of quote currency. For 
                      example, **34243** Euros.                   

                        - `size`: the amount of base currency in the offer. For example, **0.1** Bitcoin.
                    items:
                      type: array
                      items:
                        type: string
                    example:
                      - - '5001.1'
                        - '0.015'
                      - - '5001.2'
                        - '0.015'
                      - - '5001.3'
                        - '0.015'
                      - - '5001.4'
                        - '0.015'
                  timestamp:
                    description: |
                      The Unix timestamp in nanoseconds when the snapshot was taken.
                    type: integer
                    format: unix-timestamp in nanoseconds
                    example: 1752139200000000000
      4XX:
        description: 'For error codes, see [Handle errors](/docs/errors).'
  '/report/{market}/book':
    get:
      tags:
        - Market data
      summary: Get order book report
      description: |
        Returns the list of up to 1000 bids and asks for the specified `market`, sorted by `price`. Includes the data compliant with the European Markets in Crypto-Assets (MiCA) regulation.

        :::info
        This is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).
        :::
        **Rate limit weight points**: 1
      parameters:
        - name: market
          description: |
            The market for which to return the order book.
          in: path
          required: true
          example: BTC-EUR
          schema:
            type: string
        - name: depth
          description: |
            The number of `bids` and `asks` to return.
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            default: 1000
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            bitvavo.book('BTC-EUR', {}, (error, response) => {
              if (error === null) {
                for (let entry of response.bids) {
                  console.log('Bids: ', entry)
                }
                for (let entry of response.asks) {
                  console.log('Asks: ', entry)
                }
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo()
            response = bitvavo.book('BTC-EUR', {})
            for item in response['bids']:
              print('Bids', item)
            for item in response['asks']:
              print('Asks', item)
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.Book("BTC-EUR", map[string]string{}) if err != nil { fmt.Println(err) } else { fmt.Printf("%+v\n", response) }
      responses:
        '200':
          description: The request was successful.
          headers:
            bitvavo-ratelimit-remaining:
              description: 'The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.'
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: 'The number of available [weight points](/docs/rate-limits) in one minute.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissionTimestamp:
                    type: string
                    format: date-time
                    example: '2025-05-02T14:23:11.123456Z'
                    description: |
                      The timestamp when the order book is submitted to the database.
                  assetCode:
                    description: |
                      The DTI code or a symbol of the asset.
                    type: string
                    example: 4K6P57CMJ
                  assetName:
                    description: |
                      The full name of the asset.
                    type: string
                    example: Bitcoin
                  bids:
                    type: array
                    description: |
                      The list of buy orders for the specified `market` and `depth`. Each bid includes:
                    items:
                      type: object
                      properties:
                        side:
                          type: string
                          enum:
                            - BUYI
                          description: Indicates if the order is to buy or sell.
                        price:
                          type: string
                          format: decimal
                          example: '28500.1234567890123'
                          description: The amount of quote currency for 1 unit of the base currency.
                        quantity:
                          type: string
                          format: decimal
                          example: '0.00123456789012345'
                          description: The quantity of the asset.
                        numOrders:
                          type: integer
                          example: 38
                          description: The number of individual orders at this price level.
                    example:
                      - side: BUYI
                        price: '28500.12'
                        quantity: '0.5'
                        numOrders: 12
                      - side: BUYI
                        price: '28499.90'
                        quantity: '0.75'
                        numOrders: 8
                  asks:
                    type: array
                    description: |
                      The list of sell orders for the specified `market` and `depth`. Each ask includes:
                    items:
                      type: object
                      properties:
                        side:
                          type: string
                          enum:
                            - SELL
                          description: Indicates if the order is to buy or sell.
                        price:
                          type: string
                          format: decimal
                          example: '28500.1234567890123'
                          description: The amount of quote currency for 1 unit of the base currency.
                        quantity:
                          type: string
                          format: decimal
                          example: '0.00123456789012345'
                          description: The quantity of the asset.
                        numOrders:
                          type: integer
                          example: 38
                          description: The number of individual orders at this price level.
                    example:
                      - side: SELL
                        price: '28510.00'
                        quantity: '0.4'
                        numOrders: 9
                      - side: SELL
                        price: '28520.00'
                        quantity: '1.1'
                        numOrders: 14
                  priceCurrency:
                    description: |
                      The DTI code or a symbol of the currency in which the price is expressed.
                    type: string
                    example: 4K6P57CMJ
                  priceNotation:
                    description: |
                      The price expressed as a monetary value.
                    type: string
                    example: MONE
                    enum:
                      - MONE
                  quantityCurrency:
                    description: |
                      The currency in which the quantity of the crypto asset is expressed.
                    type: string
                    example: EUR
                  quantityNotation:
                    description: |
                      The quantity of the crypto asset.
                    type: string
                    example: CRYP
                    enum:
                      - CRYP
                  venue:
                    description: |
                      The Market Identifier Code of the Bitvavo trading platform.
                    type: string
                    example: VAVO
                  tradingSystem:
                    description: |
                      The trading system identifier of the Bitvavo trading platform.
                    type: string
                    example: VAVO
                  publicationTimestamp:
                    type: string
                    format: date-time
                    example: '2025-05-02T14:23:11.123456Z'
                    description: |
                      The timestamp when the book snapshot is added to the database.
      4XX:
        description: 'For error codes, see [Handle errors](/docs/errors).'
  '/{market}/trades':
    get:
      tags:
        - Market data
      summary: Get trades
      description: |
        Returns the list of trades made by all Bitvavo users for the specified `market` and time period up to 24 hours. 

        The returned trades are sorted by their `timestamp` in a descending order, from the latest to the earliest.

        :::info
        This is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).
        :::

        :::tip
        To get the list of your past trades, make a [Get trades history](/docs/rest-api/get-trades) request.
        :::

        **Rate limit weight points**: 5
      parameters:
        - name: market
          required: true
          in: path
          example: BTC-EUR
          description: |
            The market for which to return the trades.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: |
            The maximum number of trades to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: start
          required: false
          in: query
          description: |
            The Unix timestamp starting from which to return trades.
            <br/>
            > Can only return trades for a period of up to 24 hours.
          schema:
            type: integer
            format: unix-timestamp in milliseconds
            minimum: 0
        - name: end
          required: false
          in: query
          description: |
            The Unix timestamp until which to return trades.
            <br/>
            > Cannot be more than 24 hours after the `start` parameter. Can only return trades for a period of up to 24 hours.
          schema:
            type: integer
            format: unix-timestamp in milliseconds
            maximum: 8640000000000000
        - name: tradeIdFrom
          required: false
          in: query
          description: |
            The unique identifier of the trade starting from which to return the trades.
          schema:
            type: string
        - name: tradeIdTo
          required: false
          in: query
          description: |
            The unique identifier of the trade up to which to return the trades.
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            // All optional parameters are used to limit the results.
            bitvavo.publicTrades('BTC-EUR', {}, (error, response) => {
              if (error === null) {
                console.log('Trade: ', response)
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo

            bitvavo = Bitvavo()
            response = bitvavo.publicTrades('BTC-EUR', {})
            for trade in response:
              print(trade)
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.PublicTrades("BTC-EUR", map[string]string{}) if err != nil { fmt.Println(err) } else { for _, trade := range response { fmt.Printf("%+v\n", trade) } }
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: The unique identifier of the trade.
                      type: string
                      example: 57b1159b-6bf5-4cde-9e2c-6bd6a5678baf
                    timestamp:
                      description: The Unix timestamp when the trade was made.
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: 1542967486256
                    amount:
                      description: |
                        The amount of base currency exchanged in the trade. For example, **0.1** Bitcoin.   
                      type: string
                      example: '0.1'
                    price:
                      description: |
                        The price of 1 unit of base currency in the amount of quote currency at the time of the trade.
                        For example, **34243** Euro.  
                      type: string
                      example: '34,243'
                    side:
                      description: |
                        Indicates if the taker, who fills the order, is selling or buying.
                      type: string
                      enum:
                        - sell
                        - buy
        4XX:
          description: 'For error codes, see [Handle errors](/docs/errors).'
