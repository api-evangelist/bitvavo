  '/{market}/candles':
    get:
      tags:
        - Market data
      summary: Get candlestick data
      description: |
        Returns the [OHLCV](https://www.investopedia.com/terms/o/ohlcchart.asp) market data used to create [candlestick charts](https://learn.bitvavo.com/article/what-are-candlestick-patterns/1199).

        Candlestick data is always returned in chronological order from the latest to the earliest. Data is returned when trades are made in the `interval` represented by that candlestick. If no trades occur you see a gap in data flow - zero trades are represented by zero candlesticks.

        :::info
        This is a *public* endpoint. However, [authenticating](/docs/rest-api/introduction/) your request gives you a [higher rate limit](/docs/rate-limits/#how-its-calculated).
        :::  
        **Rate limit weight points**: 1
      parameters:
        - name: market
          in: path
          required: true
          example: BTC-EUR
          description: |
            The market for which to return the candlestick data.

            > For the list of all markets on Bitvavo, make a [Get markets](/docs/rest-api/get-markets) request.
          schema:
            type: string
        - name: interval
          in: query
          required: true
          description: |
            The time interval between each candlestick. Determines the allowed values for `start` and `end` parameters.
          schema:
            type: string
            enum:
              - 1m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 6h
              - 8h
              - 12h
              - 1d
              - 1W
              - 1M
        - name: limit
          in: query
          description: |
            The maximum number of candlestick data to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 1440
        - name: start
          required: false
          in: query
          description: |
            The Unix timestamp starting from which to return the candlestick data.
            <br/>
            > The timestamp must align exactly with the start of the specified `interval`. For example, for a 1-hour candlestick that starts at 13:00:00.000 Amsterdam time, use `1704067200000`.
          schema:
            type: integer
            format: unix-timestamp in milliseconds
            minimum: 0
          example: 1704067200000
        - name: end
          required: false
          in: query
          description: |
            The Unix timestamp until which to return the candlestick data.
            <br/>
            > The timestamp must align exactly with the end of the specified `interval`. For example, for a 1-hour candlestick that ends at 14:00:00.000 Amsterdam time, use `1766062800000`.
          schema:
            type: integer
            format: unix-timestamp in milliseconds
            maximum: 8640000000000000
          example: 1704153600000
      x-codeSamples:
        - lang: JavaScript
          source: |
            // The Javascript SDK works with callbacks and with promises. For info, check our GitHub.
            const bitvavo = require('bitvavo')()
            bitvavo.candles('BTC-EUR', '1h', {}, (error, response) => {
              if (error === null) {
                for (let entry of response.candles) {
                  console.log('Timestamp: ', entry[0], ' Open: ', entry[1], ' High: ', entry[2], ' Low: ', entry[3], ' Close: ', entry[4], ' Volume: ', entry[5])
                }
              } else {
                console.log(error)
              }
            })
        - lang: Python
          source: |
            from python_bitvavo_api.bitvavo import Bitvavo
            from datetime import datetime, timezone

            bitvavo = Bitvavo()

            # Query the last 1440 one hour candles of the BTC-EUR market
            candles = bitvavo.candles('BTC-EUR', '1h')
            for (ts, o, h, l, c, v) in candles:
              print('Timestamp', ts, 'open', o, 'high', h, 'low', l, 'close', c, 'volume', v)

            # Limit the result to 10 values
            candles = bitvavo.candles('BTC-EUR', '1h', limit=10)
            for (ts, o, h, l, c, v) in candles:
              print('Timestamp', ts, 'open', o, 'high', h, 'low', l, 'close', c, 'volume', v)

            # Specify a date range
            start = datetime(year=2024, month=1, day=1, hour=0, minute=0, tzinfo=timezone.utc)
            end   = datetime(year=2024, month=1, day=1, hour=1, minute=0, tzinfo=timezone.utc)
            candles = bitvavo.candles('BTC-EUR', '15m', start=start, end=end)
            for (ts, o, h, l, c, v) in candles:
              print('Timestamp', ts, 'open', o, 'high', h, 'low', l, 'close', c, 'volume', v)

            # Before 1.3.2
            candles = bitvavo.candles('BTC-EUR', '1h', {})
            for candle in candles:
              print('Timestamp', candle[0], ' open', candle[1], ' high', candle[2], ' low', candle[3], ' close', candle[4], ' volume', candle[5])
        - lang: Go
          source: |-
            import . "bitvavo" bitvavo := Bitvavo{}
            response, err := bitvavo.Candles("BTC-EUR", "1h", map[string]string{}) if err != nil { fmt.Println(err) } else { for _, candle := range response.Candles { fmt.Printf("%+v\n", candle) } }
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      description: The start time for this candlestick data.
                      type: integer
                      format: unix-timestamp in milliseconds
                      example: '1538784000000'
                    open:
                      description: The starting price for the `market` at `timestamp`.
                      type: string
                      example: '4999'
                    high:
                      description: The highest price for the `market` during the `interval`.
                      type: string
                      example: '5012'
                    low:
                      description: The lowest price for the `market` during the `interval`.
                      type: string
                      example: '4999'
                    close:
                      description: The closing price for the `market` after the `interval`.
                      type: string
                      example: '5012'
                    volume:
                      description: The amount traded in the `market` during the `interval`.
                      type: string
                      example: '0.45'
                minItems: 6
                maxItems: 6
                example:
                  - '1538784000000'
                  - '4999'
                  - '5012'
                  - '4999'
                  - '5012'
                  - '0.45'
        4XX:
          description: 'For error codes, see [Handle errors](/docs/errors).'
