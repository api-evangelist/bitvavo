  /crypto/withdrawal:
    post:
      tags:
        - Transfer
      summary: Withdraw crypto assets
      security:
        - Bitvavo-Access-Key: []
          Bitvavo-Access-Timestamp: []
          Bitvavo-Access-Signature: []
          Bitvavo-Access-Window: []
      description: |
        Request to withdraw crypto assets to a wallet over the specified network.

        :::info
        This is a *private* endpoint. To send requests, you need to [authenticate](/docs/rest-api/introduction/).
        :::

        **Rate limit weight points**: **25**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
                - network
                - address
                - amount
              properties:
                asset:
                  type: string
                  minLength: 1
                  maxLength: 10
                  example: BTC
                  description: |
                    The asset you want to withdraw.
                network:
                  type: string
                  minLength: 1
                  maxLength: 10
                  example: BTC
                  description: |
                    The network you want to withdraw the asset to.
                address:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: BitcoinAddress
                  description: |
                    The address where to withdraw the asset to.
                    <br/>
                    > Make sure to check the address. Funds cannot be recovered after being withdrawn to the wrong address.
                amount:
                  type: string
                  example: '0.05'
                  description: |
                    The amount to withdraw as a decimal string.
                deductFeeFromAmount:
                  type: boolean
                  default: false
                  description: |
                    If **false** (default), the recipient receives the full `amount` and the fee is charged separately. If **true**, the fee is deducted from `amount` before it is sent.
                idempotencyKey:
                  type: string
                  minLength: 5
                  maxLength: 50
                  example: unique-key-123
                  description: |
                    Retries with the same key return the existing withdrawal when the request matches; otherwise the request is rejected.
                memo:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: |
                    Memo or tag for networks that require it. Must match the one from the address book. Also known as *note* or *paymentId*.
            example:
              asset: BTC
              network: BTC
              address: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
              amount: '0.05'
              deductFeeFromAmount: false
              idempotencyKey: unique-key-123
      responses:
        '201':
          description: The withdrawal was created.
          headers:
            bitvavo-ratelimit-remaining:
              description: 'The number of remaining [weight points](/docs/rate-limits) before it resets at `bitvavo-ratelimit-resetat`.'
              schema:
                type: integer
            bitvavo-ratelimit-resetat:
              description: The time when `bitvavo-ratelimit-remaining` resets to `bitvavo-ratelimit-limit`.
              schema:
                type: integer
                format: unix-timestamp in milliseconds
            bitvavo-ratelimit-limit:
              description: 'The number of available [weight points](/docs/rate-limits) in one minute.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier of the withdrawal.
                    example: wd-abc123
                  asset:
                    type: string
                    minLength: 1
                    maxLength: 10
                    example: BTC
                    description: |
                      The asset that was withdrawn.
                  network:
                    type: string
                    minLength: 1
                    maxLength: 10
                    example: BTC
                    description: |
                      The network the asset was withdrawn to.
                  address:
                    type: string
                    minLength: 1
                    maxLength: 500
                    example: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                    description: The address where the asset was withdrawn to.
                  amount:
                    type: string
                    example: '0.05'
                    description: |
                      The amount that was withdrawn as a decimal string.
                  fee:
                    type: string
                    example: '0.0001'
                    description: The withdrawal fee as a decimal string.
                  createdAt:
                    type: string
                    format: date-time
                    example: '2026-05-19T12:00:00.000Z'
                    description: The creation time of the withdrawal.
        4XX:
          description: 'For error codes, see [Handle errors](/docs/errors).'
